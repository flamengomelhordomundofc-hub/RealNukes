            private static void drawTube(PoseStack ps, VertexConsumer vc, float r0, float r1, float y0, float y1, int segs, float r, float g, float b, float a, int light) {
              PoseStack.Pose pose = ps.last();
              Matrix4f m = pose.pose();
              Matrix3f n = pose.normal();
              for (int i = 0; i < segs; i++) {
