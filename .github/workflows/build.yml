          import net.minecraft.world.level.block.state.BlockState;
          import net.minecraft.world.phys.BlockHitResult;
          public class NuclearBombBlock extends Block {
            public final NukeType nukeType;
            public NuclearBombBlock(NukeType type, Properties props) {
              super(props);
              this.nukeType = type;
            }
            public void primeBomb(Level level, BlockPos pos, int fuse) {
              if (level.isClientSide) return;
              level.removeBlock(pos, false);
              PrimedNukeEntity e = new PrimedNukeEntity(ModEntities.PRIMED_NUKE.get(), level);
              e.setPos(pos.getX() + 0.5, pos.getY(), pos.getZ() + 0.5);
              e.setNukeType(nukeType);
              e.setFuse(fuse);
              level.addFreshEntity(e);
              level.playSound(null, pos, SoundEvents.TNT_PRIMED, SoundSource.BLOCKS, 1.5f, 0.7f);
            }
            @Override
            public InteractionResult use(BlockState st, Level lv, BlockPos pos, Player p, InteractionHand hand, BlockHitResult hit) {
              ItemStack it = p.getItemInHand(hand);
              if (it.getItem() instanceof RemoteDetonatorItem) return InteractionResult.PASS;
              if (it.is(Items.FLINT_AND_STEEL) || it.is(Items.FIRE_CHARGE) || it.is(Items.BLAZE_ROD)) {
                if (!lv.isClientSide) primeBomb(lv, pos, p.isShiftKeyDown() ? 8 : 65);
                return InteractionResult.sidedSuccess(lv.isClientSide);
              }
              if (!lv.isClientSide) p.displayClientMessage(Component.translatable("msg.realnukes.hint").withStyle(ChatFormatting.YELLOW), true);
              return InteractionResult.sidedSuccess(lv.isClientSide);
            }
            @Override
            public void onPlace(BlockState st, Level lv, BlockPos pos, BlockState oldSt, boolean mv) {
              if (!lv.isClientSide && lv.hasNeighborSignal(pos)) primeBomb(lv, pos, 45);
            }
            @Override
            public void neighborChanged(BlockState st, Level lv, BlockPos pos, Block blk, BlockPos from, boolean mv) {
              if (!lv.isClientSide && lv.hasNeighborSignal(pos)) primeBomb(lv, pos, 45);
            }
            @Override
            public void wasExploded(Level lv, BlockPos pos, Explosion ex) {
              if (!lv.isClientSide) primeBomb(lv, pos, 12);
            }
            @Override
            public void appendHoverText(ItemStack st, @Nullable BlockGetter bg, List<Component> tip, TooltipFlag fl) {
              tip.add(Component.literal("Raio de Destruicao: " + nukeType.radius + " blocos").withStyle(ChatFormatting.RED));
              tip.add(Component.literal("Altura da Nuvem 3D: " + (int)nukeType.cloudH + " blocos").withStyle(ChatFormatting.GOLD));
              if (nukeType.radRadius > 0) tip.add(Component.literal("Radiacao: " + nukeType.radRadius + " blocos (" + nukeType.radSec + "s)").withStyle(ChatFormatting.GREEN));
              tip.add(Component.literal("Detone com Isqueiro, Redstone ou Detonador Remoto").withStyle(ChatFormatting.GRAY));
            }
          }
