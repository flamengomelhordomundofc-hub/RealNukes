          w(J + 'NuclearExplosionManager.java', """
          package com.realnukes;
          import java.util.ArrayList;
          import java.util.Arrays;
          import java.util.HashMap;
          import java.util.Iterator;
          import java.util.List;
          import java.util.Map;
          import net.minecraft.core.BlockPos;
          import net.minecraft.resources.ResourceKey;
          import net.minecraft.server.level.ServerLevel;
          import net.minecraft.sounds.SoundEvents;
          import net.minecraft.sounds.SoundSource;
          import net.minecraft.world.effect.MobEffectInstance;
          import net.minecraft.world.effect.MobEffects;
          import net.minecraft.world.entity.LivingEntity;
          import net.minecraft.world.entity.player.Player;
          import net.minecraft.world.level.Level;
          import net.minecraft.world.level.block.Block;
          import net.minecraft.world.level.block.Blocks;
          import net.minecraft.world.level.block.state.BlockState;
          import net.minecraft.world.phys.AABB;
          import net.minecraft.world.phys.Vec3;
          import net.minecraftforge.event.TickEvent;
          import net.minecraftforge.event.level.LevelEvent;
          import net.minecraftforge.eventbus.api.SubscribeEvent;
          import net.minecraftforge.fml.common.Mod;

          @Mod.EventBusSubscriber(modid = RealNukesMod.MODID, bus = Mod.EventBusSubscriber.Bus.FORGE)
          public class NuclearExplosionManager {
            private static final Map<ResourceKey<Level>, List<ActiveBlast>> BLASTS = new HashMap<>();
            private static final Map<ResourceKey<Level>, List<RadiationZone>> RAD_ZONES = new HashMap<>();

            public static void detonate(ServerLevel level, Vec3 pos, NukeType type) {
              MushroomCloudEntity cloud = new MushroomCloudEntity(ModEntities.MUSHROOM_CLOUD.get(), level);
              cloud.setPos(pos.x, pos.y, pos.z);
              cloud.setNukeType(type);
              level.addFreshEntity(cloud);

              level.playSound(null, pos.x, pos.y, pos.z, SoundEvents.GENERIC_EXPLODE, SoundSource.BLOCKS, 8.0f, 0.45f);

              BLASTS.computeIfAbsent(level.dimension(), k -> new ArrayList<>()).add(new ActiveBlast(pos, type));

              if (type.radRadius > 0 && type.radSec > 0) {
                double maxRad = type == NukeType.COBALT ? 52.0 : (type.neutron ? 60.0 : 28.0);
                RAD_ZONES.computeIfAbsent(level.dimension(), k -> new ArrayList<>())
                  .add(new RadiationZone(pos, type.radRadius, type.radSec * 20, maxRad));
              }
            }

            public static double getRadiationAt(ServerLevel level, Vec3 pos) {
              double total = 0.0;
              List<RadiationZone> zones = RAD_ZONES.get(level.dimension());
              if (zones != null) {
                for (RadiationZone z : zones) {
                  total += z.getRadAt(pos);
                }
              }
              BlockPos center = BlockPos.containing(pos);
              BlockPos.MutableBlockPos mp = new BlockPos.MutableBlockPos();
              for (int dx = -3; dx <= 3; dx++) {
                for (int dy = -2; dy <= 2; dy++) {
                  for (int dz = -3; dz <= 3; dz++) {
                    mp.set(center.getX() + dx, center.getY() + dy, center.getZ() + dz);
                    Block b = level.getBlockState(mp).getBlock();
                    if (b == ModBlocks.PLUTONIUM_CORE_BLOCK.get()) total += 6.5;
                    else if (b == ModBlocks.URANIUM_ORE_BLOCK.get()) total += 3.0;
                    else if (b == ModBlocks.RADIOACTIVE_ASH.get()) total += 0.6;
                    else if (b == ModBlocks.TRINITITE_BLOCK.get()) total += 0.35;
                  }
                }
              }
              return total;
            }

            @SubscribeEvent
            public static void onLevelTick(TickEvent.LevelTickEvent event) {
              if (event.phase != TickEvent.Phase.END || !(event.level instanceof ServerLevel sl)) return;
              ResourceKey<Level> dim = sl.dimension();

              List<ActiveBlast> blasts = BLASTS.get(dim);
              if (blasts != null && !blasts.isEmpty()) {
                Iterator<ActiveBlast> it = blasts.iterator();
                while (it.hasNext()) {
                  if (it.next().tick(sl)) it.remove();
                }
              }

              List<RadiationZone> zones = RAD_ZONES.get(dim);
              if (zones != null && !zones.isEmpty()) {
                Iterator<RadiationZone> it = zones.iterator();
                while (it.hasNext()) {
                  RadiationZone z = it.next();
                  z.ticksLeft--;
                  if (z.ticksLeft <= 0) it.remove();
                }
                if (sl.getGameTime() % 20 == 0) {
                  applyRadiationEffects(sl, zones);
                }
              }
            }

            private static void applyRadiationEffects(ServerLevel sl, List<RadiationZone> zones) {
              for (RadiationZone z : zones) {
                AABB box = new AABB(
                  z.center.x - z.radius, z.center.y - z.radius, z.center.z - z.radius,
                  z.center.x + z.radius, z.center.y + z.radius, z.center.z + z.radius
                );
                for (LivingEntity e : sl.getEntitiesOfClass(LivingEntity.class, box)) {
                  double rad = z.getRadAt(e.position());
                  if (rad < 1.5) continue;
                  if (e instanceof Player p) {
                    if (p.getMainHandItem().is(ModItems.GEIGER_COUNTER.get()) || p.getOffhandItem().is(ModItems.GEIGER_COUNTER.get())) {
                      sl.playSound(null, p.blockPosition(), SoundEvents.STONE_BUTTON_CLICK_ON, SoundSource.PLAYERS, 0.5f, (float)Math.min(2.0, 1.0 + rad * 0.025));
                    }
                    if (p.isCreative() || p.isSpectator()) continue;
                  }
                  if (HazmatArmorMaterial.hasFullHazmat(e)) continue;
                  e.addEffect(new MobEffectInstance(MobEffects.WEAKNESS, 60, 0, false, false));
                  if (rad >= 6.0) {
                    e.addEffect(new MobEffectInstance(MobEffects.POISON, 60, 0, false, false));
                    e.addEffect(new MobEffectInstance(MobEffects.CONFUSION, 80, 0, false, false));
                  }
                  if (rad >= 16.0) {
                    e.addEffect(new MobEffectInstance(MobEffects.WITHER, 60, 1, false, false));
                    e.hurt(sl.damageSources().magic(), (float)Math.min(6.0, rad * 0.14));
                  }
                }
              }
            }

            @SubscribeEvent
            public static void onLevelUnload(LevelEvent.Unload event) {
              if (event.getLevel() instanceof ServerLevel sl) {
                BLASTS.remove(sl.dimension());
                RAD_ZONES.remove(sl.dimension());
              }
            }

            private static class RadiationZone {
              final Vec3 center;
              final double radius;
              final int maxTicks;
              final double maxRad;
              int ticksLeft;
              RadiationZone(Vec3 c, double r, int ticks, double maxRad) {
                this.center = c; this.radius = r; this.maxTicks = ticks; this.ticksLeft = ticks; this.maxRad = maxRad;
              }
              double getRadAt(Vec3 pos) {
                double d = pos.distanceTo(center);
                if (d >= radius) return 0.0;
                double falloff = 1.0 - (d / radius);
                double decay = Math.max(0.25, (double)ticksLeft / (double)maxTicks);
                return maxRad * falloff * decay;
              }
            }

            private static class ActiveBlast {
              final Vec3 center;
              final int cx, cy, cz;
              final NukeType type;
              final long[] columns;
              int colIndex = 0;
              int tickAge = 0;
              boolean neutronApplied = false;

              ActiveBlast(Vec3 pos, NukeType type) {
                this.center = pos;
                this.cx = (int)Math.floor(pos.x);
                this.cy = (int)Math.floor(pos.y);
                this.cz = (int)Math.floor(pos.z);
                this.type = type;
                int r = type.radius;
                int r2 = r * r;
                long[] tmp = new long[(r * 2 + 1) * (r * 2 + 1)];
                int count = 0;
                for (int dx = -r; dx <= r; dx++) {
                  for (int dz = -r; dz <= r; dz++) {
                    int d2 = dx * dx + dz * dz;
                    if (d2 <= r2) {
                      tmp[count++] = ((long)d2 << 32) | ((long)(dx + 512) << 16) | (long)(dz + 512);
                    }
                  }
                }
                this.columns = Arrays.copyOf(tmp, count);
                Arrays.sort(this.columns);
              }

              boolean tick(ServerLevel sl) {
                tickAge++;
                double prevWave = (tickAge - 1) * 4.2;
                double currWave = tickAge * 4.2;
                double maxWave = type.radius * 2.5 + 18.0;

                if (prevWave < maxWave) {
                  applyShockwave(sl, prevWave, currWave);
                }

                if (type.neutron && !neutronApplied && tickAge >= 3) {
                  neutronApplied = true;
                  double nr = type.radRadius;
                  AABB box = new AABB(center.x - nr, center.y - nr, center.z - nr, center.x + nr, center.y + nr, center.z + nr);
                  for (LivingEntity e : sl.getEntitiesOfClass(LivingEntity.class, box)) {
                    if (e instanceof Player p && (p.isCreative() || p.isSpectator())) continue;
                    if (HazmatArmorMaterial.hasFullHazmat(e)) continue;
                    double d = e.position().distanceTo(center);
                    if (d <= nr) {
                      e.addEffect(new MobEffectInstance(MobEffects.WITHER, 400, 2));
                      e.addEffect(new MobEffectInstance(MobEffects.POISON, 400, 1));
                      e.hurt(sl.damageSources().magic(), (float)(32.0 * (1.0 - d / nr)));
                    }
                  }
                }

                int blockBudget = type.radius >= 60 ? 3200 : 2200;
                int edits = 0;
                int r = type.radius;
                double r2 = (double)r * (double)r;
                int minWorldY = sl.getMinBuildHeight() + 1;
                int maxWorldY = sl.getMaxBuildHeight() - 1;
                BlockPos.MutableBlockPos mp = new BlockPos.MutableBlockPos();

                while (colIndex < columns.length && edits < blockBudget) {
                  long packed = columns[colIndex++];
                  int d2 = (int)(packed >>> 32);
                  int dx = (int)((packed >>> 16) & 0xFFFF) - 512;
                  int dz = (int)(packed & 0xFFFF) - 512;

                  double dyMax = Math.sqrt(Math.max(0.0, r2 - d2));
                  int depth = (int)Math.round(dyMax * (type.antimatter ? 0.92 : 0.62));
                  int height = (int)Math.round(dyMax * 1.15) + 6;

                  int yBot = Math.max(minWorldY, cy - depth);
                  int yTop = Math.min(maxWorldY, cy + height);
                  int x = cx + dx;
                  int z = cz + dz;

                  for (int y = yTop; y >= yBot; y--) {
                    mp.set(x, y, z);
                    BlockState st = sl.getBlockState(mp);
                    if (st.isAir()) continue;
                    if (st.getDestroySpeed(sl, mp) < 0.0f) continue;
                    float res = st.getBlock().getExplosionResistance();
                    if (!type.antimatter && res >= 1200.0f) continue;
                    if (type.antimatter && res >= 2000.0f && d2 > (r * r) / 9) continue;
                    sl.setBlock(mp, Blocks.AIR.defaultBlockState(), 2);
                    edits++;
                  }

                  int floorY = yBot - 1;
                  if (floorY >= minWorldY && !type.antimatter) {
                    mp.set(x, floorY, z);
                    BlockState floorSt = sl.getBlockState(mp);
                    if (!floorSt.isAir() && floorSt.getDestroySpeed(sl, mp) >= 0.0f && floorSt.getBlock().getExplosionResistance() < 1200.0f) {
                      double rnd = sl.random.nextDouble();
                      if (type.lava) {
                        if (rnd < 0.22) sl.setBlock(mp, Blocks.LAVA.defaultBlockState(), 2);
                        else if (rnd < 0.58) sl.setBlock(mp, Blocks.MAGMA_BLOCK.defaultBlockState(), 2);
                        else if (rnd < 0.72) {
                          mp.set(x, floorY + 1, z);
                          if (sl.getBlockState(mp).isAir()) sl.setBlock(mp, Blocks.FIRE.defaultBlockState(), 2);
                        }
                      } else if (type.trinitite) {
                        if (rnd < 0.28) sl.setBlock(mp, ModBlocks.TRINITITE_BLOCK.get().defaultBlockState(), 2);
                        else if (rnd < 0.56) sl.setBlock(mp, ModBlocks.RADIOACTIVE_ASH.get().defaultBlockState(), 2);
                        else if (rnd < 0.68) {
                          mp.set(x, floorY + 1, z);
                          if (sl.getBlockState(mp).isAir()) sl.setBlock(mp, Blocks.FIRE.defaultBlockState(), 2);
                        }
                      }
                      edits++;
                    }
                  }
                }
                return colIndex >= columns.length && prevWave >= maxWave;
              }

              private void applyShockwave(ServerLevel sl, double minR, double maxR) {
                AABB box = new AABB(
                  center.x - maxR, center.y - maxR, center.z - maxR,
                  center.x + maxR, center.y + maxR, center.z + maxR
                );
                for (LivingEntity e : sl.getEntitiesOfClass(LivingEntity.class, box)) {
                  double d = e.position().distanceTo(center);
                  if (d < minR || d > maxR) continue;
                  if (e instanceof Player p && (p.isCreative() || p.isSpectator())) continue;
                  double factor = Math.max(0.0, 1.0 - d / (type.radius * 2.5 + 18.0));
                  Vec3 push = e.position().subtract(center);
                  if (push.lengthSqr() < 0.001) push = new Vec3(0, 1, 0);
                  push = push.normalize().scale(2.8 * factor + 0.4);
                  e.setDeltaMovement(e.getDeltaMovement().add(push.x, Math.max(0.35, push.y + 0.55 * factor), push.z));
                  e.hurtMarked = true;
                  float dmg = (float)(factor * (type.radius * 1.45));
                  if (HazmatArmorMaterial.hasFullHazmat(e)) dmg *= 0.45f;
                  if (dmg > 1.0f) {
                    e.hurt(sl.damageSources().explosion(null, null), dmg);
                  }
                  if (factor > 0.35 && !type.antimatter) {
                    e.setSecondsOnFire((int)(8 * factor));
                  }
                }
              }
            }
          }
          """)

          w(J + 'ClientEffects.java', """
          package com.realnukes;
          import java.util.HashSet;
          import java.util.Set;
          import net.minecraft.client.Minecraft;
          import net.minecraft.sounds.SoundEvents;
          import net.minecraft.sounds.SoundSource;
          import net.minecraft.util.Mth;
          import net.minecraft.world.phys.Vec3;
          import net.minecraftforge.api.distmarker.Dist;
          import net.minecraftforge.client.event.RenderGuiEvent;
          import net.minecraftforge.client.event.ViewportEvent;
          import net.minecraftforge.event.TickEvent;
          import net.minecraftforge.eventbus.api.SubscribeEvent;
          import net.minecraftforge.fml.common.Mod;

          @Mod.EventBusSubscriber(modid = RealNukesMod.MODID, bus = Mod.EventBusSubscriber.Bus.FORGE, value = Dist.CLIENT)
          public class ClientEffects {
            private static final Set<Integer> FLASHED = new HashSet<>();
            private static final Set<Integer> SHOCKED = new HashSet<>();
            private static int flashAge = 999;
            private static float flashPower = 0f;
            private static float flashR = 1f, flashG = 0.96f, flashB = 0.88f;
            private static int shakeTicks = 0;
            private static int shakeMaxTicks = 1;
            private static float shakePower = 0f;

            public static void onCloudTick(MushroomCloudEntity cloud) {
              Minecraft mc = Minecraft.getInstance();
              if (mc.player == null || mc.level == null) return;
              if (FLASHED.size() > 256) FLASHED.clear();
              if (SHOCKED.size() > 256) SHOCKED.clear();

              NukeType type = cloud.getNukeType();
              int id = cloud.getId();
              int age = cloud.getCloudAge();
              double dist = mc.player.position().distanceTo(cloud.position());

              if (age <= 20 && FLASHED.add(id)) {
                double maxDist = type.cloudR * 8.5 + 80.0;
                if (dist < maxDist) {
                  float atten = (float)Math.pow(1.0 - dist / maxDist, 0.55);
                  flashAge = 0;
                  flashPower = Math.max(flashPower, type.flash * atten);
                  flashR = 0.55f + 0.45f * type.fr;
                  flashG = 0.55f + 0.45f * type.fg;
                  flashB = 0.55f + 0.45f * type.fb;
                }
              }

              double waveRadius = age * 4.2;
              double maxSoundDist = type.cloudR * 7.5 + 90.0;
              if (!SHOCKED.contains(id) && waveRadius >= dist && dist < maxSoundDist) {
                SHOCKED.add(id);
                float atten = (float)Math.pow(1.0 - dist / maxSoundDist, 0.75);
                shakePower = Math.max(shakePower, type.shake * atten);
                shakeMaxTicks = Math.max(45, (int)(75 * atten));
                shakeTicks = shakeMaxTicks;

                Vec3 p = mc.player.position();
                mc.level.playLocalSound(p.x, p.y, p.z, SoundEvents.GENERIC_EXPLODE, SoundSource.BLOCKS, 2.5f * atten + 0.4f, 0.45f, false);
                mc.level.playLocalSound(p.x, p.y, p.z, SoundEvents.LIGHTNING_BOLT_THUNDER, SoundSource.WEATHER, 3.0f * atten + 0.5f, 0.55f, false);
                mc.level.playLocalSound(p.x, p.y, p.z, SoundEvents.WARDEN_SONIC_BOOM, SoundSource.BLOCKS, 1.8f * atten + 0.3f, 0.4f, false);
              }
            }

            @SubscribeEvent
            public static void onClientTick(TickEvent.ClientTickEvent event) {
              if (event.phase != TickEvent.Phase.END) return;
              if (flashAge < 70) {
                flashAge++;
              } else {
                flashPower = 0f;
              }
              if (shakeTicks > 0) {
                shakeTicks--;
                if (shakeTicks <= 0) shakePower = 0f;
              }
            }

            @SubscribeEvent
            public static void onRenderGui(RenderGuiEvent.Post event) {
              if (flashPower <= 0.01f || flashAge >= 70) return;
              float t = flashAge + event.getPartialTick();
              float alpha;
              if (t < 4f) {
                alpha = (t / 4f) * 0.98f;
              } else if (t < 11f) {
                alpha = Mth.lerp((t - 4f) / 7f, 0.98f, 0.52f);
              } else if (t < 18f) {
                alpha = Mth.lerp((t - 11f) / 7f, 0.52f, 0.92f);
              } else {
                float fade = 1f - Mth.clamp((t - 18f) / 52f, 0f, 1f);
                alpha = 0.92f * fade * fade;
              }
              alpha = Mth.clamp(alpha * flashPower, 0f, 0.98f);
              if (alpha <= 0.01f) return;

              float whiteMix = t < 16f ? 0.78f : 0.25f;
              int r = (int)(Mth.clamp(Mth.lerp(whiteMix, flashR, 1f), 0f, 1f) * 255f);
              int g = (int)(Mth.clamp(Mth.lerp(whiteMix, flashG, 1f), 0f, 1f) * 255f);
              int b = (int)(Mth.clamp(Mth.lerp(whiteMix, flashB, 1f), 0f, 1f) * 255f);
              int a = (int)(alpha * 255f);
              int argb = (a << 24) | (r << 16) | (g << 8) | b;
              int w = event.getWindow().getGuiScaledWidth();
              int h = event.getWindow().getGuiScaledHeight();
              event.getGuiGraphics().fill(0, 0, w, h, argb);
            }

            @SubscribeEvent
            public static void onCameraAngles(ViewportEvent.ComputeCameraAngles event) {
              if (shakeTicks <= 0 || shakePower <= 0.01f) return;
              float progress = (shakeTicks - (float)event.getPartialTick()) / (float)shakeMaxTicks;
              if (progress <= 0f) return;
              float amp = shakePower * progress * progress;
              double time = (shakeMaxTicks - shakeTicks + event.getPartialTick()) * 1.85;
              float yawOff = (float)(Math.sin(time * 2.3) * 0.65 + Math.cos(time * 4.1) * 0.35) * amp;
              float pitchOff = (float)(Math.cos(time * 2.7) * 0.65 + Math.sin(time * 4.7) * 0.35) * amp;
              float rollOff = (float)(Math.sin(time * 3.1) * 0.85) * amp * 1.15f;
              event.setYaw(event.getYaw() + yawOff);
              event.setPitch(event.getPitch() + pitchOff);
              event.setRoll(event.getRoll() + rollOff);
            }
          }
          """)

