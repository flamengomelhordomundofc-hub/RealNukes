          # --- NukeEntities.java ---
          w(J + 'NukeEntities.java', """
          package com.realnukes;
          import net.minecraft.core.BlockPos;
          import net.minecraft.core.particles.ParticleTypes;
          import net.minecraft.nbt.CompoundTag;
          import net.minecraft.network.protocol.Packet;
          import net.minecraft.network.protocol.game.ClientGamePacketListener;
          import net.minecraft.network.protocol.game.ClientboundAddEntityPacket;
          import net.minecraft.network.syncher.EntityDataAccessor;
          import net.minecraft.network.syncher.EntityDataSerializers;
          import net.minecraft.network.syncher.SynchedEntityData;
          import net.minecraft.server.level.ServerLevel;
          import net.minecraft.sounds.SoundEvents;
          import net.minecraft.sounds.SoundSource;
          import net.minecraft.world.entity.Entity;
          import net.minecraft.world.entity.EntityType;
          import net.minecraft.world.entity.LivingEntity;
          import net.minecraft.world.entity.MoverType;
          import net.minecraft.world.entity.projectile.ThrowableItemProjectile;
          import net.minecraft.world.item.Item;
          import net.minecraft.world.level.Level;
          import net.minecraft.world.phys.AABB;
          import net.minecraft.world.phys.HitResult;

          public class NukeEntities {
            public static class NuclearCloudEntity extends Entity {
              private static final EntityDataAccessor<Integer> D_TYPE = SynchedEntityData.defineId(NuclearCloudEntity.class, EntityDataSerializers.INT);
              private static final EntityDataAccessor<Integer> D_AGE = SynchedEntityData.defineId(NuclearCloudEntity.class, EntityDataSerializers.INT);
              private boolean fxSent = false;

              public NuclearCloudEntity(EntityType<? extends NuclearCloudEntity> t, Level l) {
                super(t, l);
                this.noCulling = true;
                this.setInvulnerable(true);
              }
              @Override protected void defineSynchedData() {
                entityData.define(D_TYPE, 0);
                entityData.define(D_AGE, 0);
              }
              public void setNukeType(RealNukesMod.NukeType t) { entityData.set(D_TYPE, t.id); }
              public RealNukesMod.NukeType getNukeType() { return RealNukesMod.NukeType.byId(entityData.get(D_TYPE)); }
              public int getCloudAge() { return entityData.get(D_AGE); }
              @Override
              public void tick() {
                super.tick();
                int a = getCloudAge() + 1;
                if (!level().isClientSide) {
                  entityData.set(D_AGE, a);
                  if (a > getNukeType().dur) discard();
                } else {
                  if (!fxSent) {
                    fxSent = true;
                    ClientCinemaState.push(getX(), getY(), getZ(), getNukeType());
                  }
                  if (a < getNukeType().dur - 40 && a % 4 == 0) {
                    double r = getNukeType().cloudR * 0.6;
                    double ang = random.nextDouble() * 6.283;
                    level().addParticle(ParticleTypes.ASH, getX() + Math.cos(ang) * r * random.nextDouble(), getY() + random.nextDouble() * 26, getZ() + Math.sin(ang) * r * random.nextDouble(), 0, -0.08, 0);
                  }
                }
              }
              @Override public boolean shouldRenderAtSqrDistance(double d) { return d < 2000000.0; }
              @Override public AABB getBoundingBoxForCulling() { return new AABB(getX() - 380, getY() - 64, getZ() - 380, getX() + 380, getY() + 400, getZ() + 380); }
              @Override public boolean isAttackable() { return false; }
              @Override protected void readAdditionalSaveData(CompoundTag n) { entityData.set(D_TYPE, n.getInt("t")); entityData.set(D_AGE, n.getInt("a")); }
              @Override protected void addAdditionalSaveData(CompoundTag n) { n.putInt("t", entityData.get(D_TYPE)); n.putInt("a", entityData.get(D_AGE)); }
              @Override public Packet<ClientGamePacketListener> getAddEntityPacket() { return new ClientboundAddEntityPacket(this); }
            }

            public static class PrimedNukeEntity extends Entity {
              private static final EntityDataAccessor<Integer> D_TYPE = SynchedEntityData.defineId(PrimedNukeEntity.class, EntityDataSerializers.INT);
              private static final EntityDataAccessor<Integer> D_FUSE = SynchedEntityData.defineId(PrimedNukeEntity.class, EntityDataSerializers.INT);

              public PrimedNukeEntity(EntityType<? extends PrimedNukeEntity> t, Level l) {
                super(t, l);
                this.blocksBuilding = true;
              }
              @Override protected void defineSynchedData() {
                entityData.define(D_TYPE, 0);
                entityData.define(D_FUSE, 60);
              }
              public void setNukeType(RealNukesMod.NukeType t) { entityData.set(D_TYPE, t.id); }
              public RealNukesMod.NukeType getNukeType() { return RealNukesMod.NukeType.byId(entityData.get(D_TYPE)); }
              public void setFuse(int f) { entityData.set(D_FUSE, f); }
              public int getFuse() { return entityData.get(D_FUSE); }
              @Override
              public void tick() {
                super.tick();
                if (!isNoGravity()) setDeltaMovement(getDeltaMovement().add(0.0, -0.04, 0.0));
                move(MoverType.SELF, getDeltaMovement());
                setDeltaMovement(getDeltaMovement().scale(0.98));
                if (onGround()) setDeltaMovement(getDeltaMovement().multiply(0.7, -0.5, 0.7));
                int f = getFuse() - 1;
                setFuse(f);
                if (f <= 0) {
                  if (level() instanceof ServerLevel sl) {
                    NuclearExplosionManager.detonate(sl, blockPosition(), getNukeType());
                  }
                  discard();
                } else if (level().isClientSide) {
                  level().addParticle(ParticleTypes.SMOKE, getX(), getY() + 1.05, getZ(), 0, 0.06, 0);
                  if (f < 25) level().addParticle(ParticleTypes.FLAME, getX(), getY() + 1.05, getZ(), 0, 0.04, 0);
                } else if (f % 10 == 0 || (f < 20 && f % 4 == 0)) {
                  level().playSound(null, blockPosition(), SoundEvents.STONE_BUTTON_CLICK_ON, SoundSource.BLOCKS, 1.3f, f < 20 ? 1.8f : 1.1f);
                }
              }
              @Override protected void readAdditionalSaveData(CompoundTag n) { setNukeType(RealNukesMod.NukeType.byId(n.getInt("t"))); setFuse(n.getInt("f")); }
              @Override protected void addAdditionalSaveData(CompoundTag n) { n.putInt("t", getNukeType().id); n.putInt("f", getFuse()); }
              @Override public Packet<ClientGamePacketListener> getAddEntityPacket() { return new ClientboundAddEntityPacket(this); }
            }

            public static class MiniNukeGrenadeEntity extends ThrowableItemProjectile {
              public MiniNukeGrenadeEntity(EntityType<? extends MiniNukeGrenadeEntity> t, Level l) { super(t, l); }
              public MiniNukeGrenadeEntity(Level l, LivingEntity shooter) { super(RealNukesMod.MINI_GRENADE_ENT.get(), shooter, l); }
              @Override protected Item getDefaultItem() { return RealNukesMod.MINI_NUKE_GRENADE.get(); }
              @Override
              protected void onHit(HitResult res) {
                super.onHit(res);
                if (level() instanceof ServerLevel sl) {
                  NuclearExplosionManager.detonate(sl, BlockPos.containing(res.getLocation()), RealNukesMod.NukeType.MINI_GRENADE);
                  discard();
                }
              }
              @Override public Packet<ClientGamePacketListener> getAddEntityPacket() { return new ClientboundAddEntityPacket(this); }
            }

            public static class FallingMissileEntity extends Entity {
              public FallingMissileEntity(EntityType<? extends FallingMissileEntity> t, Level l) {
                super(t, l);
                this.noCulling = true;
              }
              @Override protected void defineSynchedData() {}
              @Override
              public void tick() {
                super.tick();
