          package com.realnukes;
          import java.util.*;
          import com.mojang.blaze3d.vertex.*;
          import net.minecraft.client.*;
          import net.minecraft.client.renderer.*;
          import net.minecraft.client.renderer.culling.Frustum;
          import net.minecraft.client.renderer.entity.*;
          import net.minecraft.client.renderer.texture.OverlayTexture;
          import net.minecraft.resources.ResourceLocation;
          import net.minecraft.world.phys.Vec3;
          import org.joml.*;

          public class NuclearCloudRenderer extends EntityRenderer<NukeEntities.NuclearCloudEntity> {
            private static final ResourceLocation CLOUD_TEX = new ResourceLocation(RealNukesMod.MODID, "textures/entity/volumetric_cloud.png");
            private static final ResourceLocation FIRE_TEX = new ResourceLocation(RealNukesMod.MODID, "textures/entity/fireball_core.png");
            private static final ResourceLocation RING_TEX = new ResourceLocation(RealNukesMod.MODID, "textures/entity/shockwave_ring.png");
            private static final RenderType RT_CLOUD = VolumetricRenderTypes.cloud(CLOUD_TEX);
            private static final RenderType RT_FIRE = VolumetricRenderTypes.glow(FIRE_TEX);
            private static final RenderType RT_RING = VolumetricRenderTypes.cloud(RING_TEX);

            private static final class Puff {
              float x, y, z, sz, rot, r, g, b, a, dsq;
              int tile;
            }

            private final Puff[] pool = new Puff[520];
            private final Puff[] active = new Puff[520];

            public NuclearCloudRenderer(EntityRendererProvider.Context c) {
              super(c);
              for (int i = 0; i < pool.length; i++) pool[i] = new Puff();
            }

            @Override public ResourceLocation getTextureLocation(NukeEntities.NuclearCloudEntity e) { return CLOUD_TEX; }
            @Override public boolean shouldRender(NukeEntities.NuclearCloudEntity e, Frustum f, double x, double y, double z) { return true; }

            private static float c01(float v) { return v < 0f ? 0f : (v > 1f ? 1f : v); }
            private static float hash(int i) {
              float s = (float)(Math.sin(i * 12.9898 + 78.233) * 43758.5453);
              return s - (float)Math.floor(s);
            }

            private int addPuff(int n, float x, float y, float z, float sz, float rot, float r, float g, float b, float a, int tile, float cx, float cy, float cz) {
              if (n >= pool.length - 1 || a < 0.01f) return n;
              Puff p = pool[n];
              p.x = x; p.y = y; p.z = z; p.sz = sz; p.rot = rot;
              p.r = c01(r); p.g = c01(g); p.b = c01(b); p.a = c01(a);
              p.tile = tile & 3;
              float dx = x - cx, dy = y - cy, dz = z - cz;
              p.dsq = dx * dx + dy * dy + dz * dz;
              active[n] = p;
              return n + 1;
            }

            private void shadeAndAdd(int[] cnt, float px, float py, float pz, float nx, float ny, float nz, float sz, float rot, float ao, float fireAmt, float alpha, int tile, RealNukesMod.NukeType ty, float coreH, float embH, float cx, float cy, float cz) {
              float sun = c01(0.50f + 0.50f * (nx * 0.55f + ny * 0.72f + nz * 0.42f));
              float lit = (0.36f + 0.76f * sun) * ao;
              float sr = ty.sr * lit * (1.0f + 0.08f * sun);
              float sg = ty.sg * lit * (0.99f + 0.04f * sun);
              float sb = ty.sb * lit * (1.06f - 0.08f * sun);
              float fh = c01(fireAmt * (embH * 1.35f + coreH * 1.6f));
              float wh = c01(fireAmt * coreH * 1.4f);
              float rr = sr * (1f - fh * 0.55f) + ty.fr * fh * 1.15f + wh * 0.8f;
              float gg = sg * (1f - fh * 0.65f) + ty.fg * fh * 1.05f + wh * 0.75f;
              float bb = sb * (1f - fh * 0.80f) + ty.fb * fh * 0.85f + wh * 0.65f;
              cnt[0] = addPuff(cnt[0], px, py, pz, sz, rot, rr, gg, bb, alpha, tile, cx, cy, cz);
            }

            @Override
            public void render(NukeEntities.NuclearCloudEntity e, float yaw, float pt, PoseStack ps, MultiBufferSource buf, int pl) {
              RealNukesMod.NukeType ty = e.getNukeType();
              float t = e.getCloudAge() + pt;
              float dur = ty.dur;
              float p = c01(t / dur);
              float fade = p > 0.78f ? c01((1f - p) / 0.22f) : 1f;
              float rise = 1f - (float)Math.pow(1f - Math.min(1f, t / (dur * 0.33f)), 3.1);
              float H = ty.cloudH * (0.07f + 0.93f * rise);
              float R = ty.cloudR * (0.24f + 0.76f * (float)Math.pow(Math.min(1f, t / (dur * 0.38f)), 0.56)) + (p > 0.34f ? (p - 0.34f) * ty.cloudR * 0.70f : 0f);
              float coreH = (float)Math.exp(-t * 0.017);
              float embH = (float)Math.exp(-t * 0.0052);

              Camera cam = this.entityRenderDispatcher.camera;
              Vec3 cp = cam.getPosition();
              float cx = (float)(cp.x - e.getX()), cy = (float)(cp.y - e.getY()), cz = (float)(cp.z - e.getZ());
              Vector3f lk = cam.getLookVector(), up = cam.getUpVector();
              float rx = lk.y * up.z - lk.z * up.y;
              float ry = lk.z * up.x - lk.x * up.z;
              float rz = lk.x * up.y - lk.y * up.x;

              PoseStack.Pose lp = ps.last();
              Matrix4f mat = lp.pose();
              Matrix3f nrm = lp.normal();

              if (t < 75f) {
                drawFresnelDome(mat, nrm, buf.getBuffer(RT_RING), t * 4.5f, c01((1f - t / 75f) * 0.75f), cx, cy, cz);
              }

              int[] cnt = {0};

              // Base surge (64 camadas)
              float baseR = R * (0.52f + p * 0.95f);
              for (int i = 0; i < 64; i++) {
                float a = (float)(i * 6.28318 / 64.0 + t * 0.004 * (i % 2 == 0 ? 1 : -1));
                float rr = baseR * (0.76f + 0.36f * hash(i * 3));
                float yy = 3.5f + hash(i * 5) * R * 0.24f;
                float px = (float)Math.cos(a) * rr, pz = (float)Math.sin(a) * rr;
                float sz = R * (0.24f + 0.14f * hash(i * 7)) * (0.55f + 0.5f * Math.min(1f, t / 30f));
                shadeAndAdd(cnt, px, yy, pz, (float)Math.cos(a), 0.35f, (float)Math.sin(a), sz, hash(i) * 6.28f + t * 0.015f * (i % 2 == 0 ? 1 : -1), 0.68f, 0.35f * coreH, 0.62f * fade, i, ty, coreH, embH, cx, cy, cz);
              }

              // Coluna ascendente giratoria (84 camadas)
              float stemR = R * 0.23f;
              for (int i = 0; i < 84; i++) {
                float ph = (i / 84f + t * 0.0058f) % 1f;
                float yy = ph * H * 0.92f;
                float waist = 1f - 0.34f * (float)Math.sin(ph * 3.14159);
                float flare = ph > 0.75f ? 1f + (ph - 0.75f) * 2.4f : (ph < 0.18f ? 1f + (0.18f - ph) * 3.2f : 1f);
                float rad = stemR * waist * flare * (0.35f + 0.75f * hash(i * 11));
                float ang = hash(i * 13) * 6.28318f + ph * 3.5f + t * 0.012f;
                float px = (float)Math.cos(ang) * rad, pz = (float)Math.sin(ang) * rad;
                float sz = stemR * (0.92f + 0.48f * hash(i * 17)) * flare;
                float inner = 1f - c01(rad / (stemR * 1.2f));
                float ao = 0.58f + 0.30f * ph;
                float fAmt = (0.25f + 0.75f * inner) * (0.35f + 0.65f * ph);
                shadeAndAdd(cnt, px, yy, pz, (float)Math.cos(ang), 0.15f, (float)Math.sin(ang), sz, hash(i * 19) * 6.28f - t * 0.02f, ao, fAmt, 0.72f * fade, i, ty, coreH, embH, cx, cy, cz);
              }

              // Toroide rolante do topo (155 camadas)
              float capH = R * 0.56f * (1f - p * 0.25f);
              for (int i = 0; i < 155; i++) {
                float az = (float)(i * 2.3999632);
                float roll = (hash(i * 23) * 6.28318f + t * 0.046f) % 6.28318f;
                float maj = R * (0.52f + 0.20f * hash(i * 29));
                float minR = R * (0.28f + 0.14f * hash(i * 31));
                float cr = (float)Math.cos(roll), sr = (float)Math.sin(roll);
                float rad = maj + minR * cr;
                float px = (float)Math.cos(az) * rad, pz = (float)Math.sin(az) * rad;
                float py = H + sr * capH * 0.62f;
                float nx = (float)Math.cos(az) * cr, ny = sr, nz = (float)Math.sin(az) * cr;
                float sz = R * (0.26f + 0.16f * hash(i * 37));
                float ao = 0.55f + 0.52f * c01(ny * 0.5f + 0.5f);
                float fAmt = c01(0.85f - ny * 0.75f - cr * 0.25f);
                shadeAndAdd(cnt, px, py, pz, nx, ny, nz, sz, hash(i * 41) * 6.28f + t * 0.018f * (i % 2 == 0 ? 1 : -1), ao, fAmt, 0.78f * fade, i, ty, coreH, embH, cx, cy, cz);
              }

              // Bigorna estratosferica iluminada pelo sol (60 camadas)
              for (int i = 0; i < 60; i++) {
                float az = (float)(i * 2.3999632 + 1.1);
                float u = hash(i * 43);
                float rad = R * 0.68f * (float)Math.sqrt(u);
                float domeY = (float)Math.sqrt(Math.max(0f, 1f - u)) * capH * 0.95f;
                float px = (float)Math.cos(az) * rad, pz = (float)Math.sin(az) * rad;
                float py = H + capH * 0.18f + domeY;
                float sz = R * (0.28f + 0.15f * hash(i * 47));
                shadeAndAdd(cnt, px, py, pz, px / (R + 1f), 0.88f, pz / (R + 1f), sz, hash(i * 53) * 6.28f + t * 0.01f, 1.08f, 0.42f * coreH, 0.82f * fade, i, ty, coreH, embH, cx, cy, cz);
              }

              // Aneis de condensacao de Wilson
              if (t > 10f && t < 260f) {
                float wf = c01((t - 10f) / 16f) * c01((260f - t) / 90f) * 0.55f;
                for (int w = 0; w < ty.rings; w++) {
                  float wy = H * (0.36f + w * 0.20f);
                  float wr = R * (0.62f + w * 0.24f) * (0.75f + (t / 260f) * 0.65f);
                  for (int i = 0; i < 24; i++) {
                    float a = (float)(i * 6.28318 / 24.0 + w);
                    cnt[0] = addPuff(cnt[0], (float)Math.cos(a) * wr, wy, (float)Math.sin(a) * wr, R * 0.20f, a + t * 0.01f, 0.96f, 0.98f, 1.0f, wf, i, cx, cy, cz);
                  }
                }
              }

              // Ordenacao por profundidade da camera a cada frame
              Arrays.sort(active, 0, cnt[0], (a, b) -> Float.compare(b.dsq, a.dsq));
              VertexConsumer vc = buf.getBuffer(RT_CLOUD);
              for (int i = 0; i < cnt[0]; i++) {
                emitBillboard(mat, nrm, vc, active[i], rx, ry, rz, up.x, up.y, up.z, true);
              }

              // Fogo incandescente aditivo brilhando nas fendas (32 camadas)
              if (t < 200f) {
                VertexConsumer fvc = buf.getBuffer(RT_FIRE);
                float fa = c01(1f - t / 200f);
                float fbY = H * (0.45f + 0.55f * Math.min(1f, t / 60f));
                for (int i = 0; i < 32; i++) {
                  float az = (float)(i * 2.39996);
                  float el = (hash(i * 61) - 0.5f) * 2.4f;
                  float frad = R * 0.38f * (0.4f + 0.7f * hash(i * 67));
                  Puff fp = pool[pool.length - 1];
                  fp.x = (float)(Math.cos(az) * Math.cos(el)) * frad;
                  fp.y = fbY + (float)Math.sin(el) * frad * 0.75f;
                  fp.z = (float)(Math.sin(az) * Math.cos(el)) * frad;
                  fp.sz = R * (0.32f + 0.20f * hash(i * 71)) * (0.7f + 0.4f * coreH);
                  fp.rot = hash(i * 73) * 6.28f + t * 0.03f;
                  fp.r = c01(ty.fr * 0.7f + coreH * 0.8f);
                  fp.g = c01(ty.fg * 0.65f + coreH * 0.75f);
                  fp.b = c01(ty.fb * 0.5f + coreH * 0.65f);
                  fp.a = fa * 0.58f;
                  emitBillboard(mat, nrm, fvc, fp, rx, ry, rz, up.x, up.y, up.z, false);
                }
              }
            }

            private static void emitBillboard(Matrix4f mat, Matrix3f nrm, VertexConsumer vc, Puff p, float rx, float ry, float rz, float ux, float uy, float uz, boolean atlas) {
              float cs = (float)Math.cos(p.rot), sn = (float)Math.sin(p.rot);
              float ax = (rx * cs + ux * sn) * p.sz, ay = (ry * cs + uy * sn) * p.sz, az = (rz * cs + uz * sn) * p.sz;
              float bx = (-rx * sn + ux * cs) * p.sz, by = (-ry * sn + uy * cs) * p.sz, bz = (-rz * sn + uz * cs) * p.sz;
              float u0 = atlas ? ((p.tile & 1) * 0.5f + 0.01f) : 0f, u1 = atlas ? (u0 + 0.48f) : 1f;
              float v0 = atlas ? (((p.tile >> 1) & 1) * 0.5f + 0.01f) : 0f, v1 = atlas ? (v0 + 0.48f) : 1f;
              vc.vertex(mat, p.x - ax - bx, p.y - ay - by, p.z - az - bz).color(p.r, p.g, p.b, p.a).uv(u0, v1).overlayCoords(OverlayTexture.NO_OVERLAY).uv2(LightTexture.FULL_BRIGHT).normal(nrm, 0, 1, 0).endVertex();
              vc.vertex(mat, p.x + ax - bx, p.y + ay - by, p.z + az - bz).color(p.r, p.g, p.b, p.a).uv(u1, v1).overlayCoords(OverlayTexture.NO_OVERLAY).uv2(LightTexture.FULL_BRIGHT).normal(nrm, 0, 1, 0).endVertex();
              vc.vertex(mat, p.x + ax + bx, p.y + ay + by, p.z + az + bz).color(p.r, p.g, p.b, p.a).uv(u1, v0).overlayCoords(OverlayTexture.NO_OVERLAY).uv2(LightTexture.FULL_BRIGHT).normal(nrm, 0, 1, 0).endVertex();
              vc.vertex(mat, p.x - ax + bx, p.y - ay + by, p.z - az + bz).color(p.r, p.g, p.b, p.a).uv(u0, v0).overlayCoords(OverlayTexture.NO_OVERLAY).uv2(LightTexture.FULL_BRIGHT).normal(nrm, 0, 1, 0).endVertex();
            }

            private static void drawFresnelDome(Matrix4f mat, Matrix3f nrm, VertexConsumer vc, float rad, float alpha, float cx, float cy, float cz) {
              int su = 24, sv = 12;
              for (int iv = 0; iv < sv; iv++) {
                float p0 = (float)(Math.PI * 0.5 * iv / sv), p1 = (float)(Math.PI * 0.5 * (iv + 1) / sv);
                for (int iu = 0; iu < su; iu++) {
                  float t0 = (float)(6.28318 * iu / su), t1 = (float)(6.28318 * (iu + 1) / su);
                  domeV(mat, nrm, vc, p0, t0, rad, alpha, cx, cy, cz);
                  domeV(mat, nrm, vc, p0, t1, rad, alpha, cx, cy, cz);
                  domeV(mat, nrm, vc, p1, t1, rad, alpha, cx, cy, cz);
                  domeV(mat, nrm, vc, p1, t0, rad, alpha, cx, cy, cz);
                }
              }
            }

            private static void domeV(Matrix4f mat, Matrix3f nrm, VertexConsumer vc, float ph, float th, float rad, float alpha, float cx, float cy, float cz) {
              float nx = (float)(Math.sin(ph) * Math.cos(th)), ny = (float)Math.cos(ph), nz = (float)(Math.sin(ph) * Math.sin(th));
              float px = nx * rad, py = ny * rad, pz = nz * rad;
              float vx = cx - px, vy = cy - py, vz = cz - pz;
              float vl = (float)Math.sqrt(vx * vx + vy * vy + vz * vz) + 0.001f;
              float dot = Math.abs((nx * vx + ny * vy + nz * vz) / vl);
              float fr = (float)Math.pow(1.0 - dot, 2.1) * alpha;
              vc.vertex(mat, px, py, pz).color(0.95f, 0.97f, 1f, c01(fr)).uv(th / 6.283f, ph / 1.57f).overlayCoords(OverlayTexture.NO_OVERLAY).uv2(LightTexture.FULL_BRIGHT).normal(nrm, nx, ny, nz).endVertex();
            }

            public static class PrimedRenderer extends EntityRenderer<NukeEntities.PrimedNukeEntity> {
              public PrimedRenderer(EntityRendererProvider.Context c) { super(c); }
