          public class PrimedNukeEntity extends Entity {
            private static final EntityDataAccessor<Integer> DATA_FUSE = SynchedEntityData.defineId(PrimedNukeEntity.class, EntityDataSerializers.INT);
            private static final EntityDataAccessor<Integer> DATA_TYPE = SynchedEntityData.defineId(PrimedNukeEntity.class, EntityDataSerializers.INT);
            public PrimedNukeEntity(EntityType<? extends PrimedNukeEntity> type, Level level) {
              super(type, level);
              this.blocksBuilding = true;
            }
            @Override
            protected void defineSynchedData() {
              this.entityData.define(DATA_FUSE, 60);
              this.entityData.define(DATA_TYPE, 0);
            }
            public void setFuse(int fuse) { this.entityData.set(DATA_FUSE, fuse); }
            public int getFuse() { return this.entityData.get(DATA_FUSE); }
            public void setNukeType(NukeType type) { this.entityData.set(DATA_TYPE, type.id); }
            public NukeType getNukeType() { return NukeType.byId(this.entityData.get(DATA_TYPE)); }
            @Override
            public void tick() {
              if (!this.isNoGravity()) {
                this.setDeltaMovement(this.getDeltaMovement().add(0.0, -0.04, 0.0));
              }
              this.move(MoverType.SELF, this.getDeltaMovement());
              this.setDeltaMovement(this.getDeltaMovement().scale(0.98));
              if (this.onGround()) {
                this.setDeltaMovement(this.getDeltaMovement().multiply(0.7, -0.5, 0.7));
              }
              int f = this.getFuse() - 1;
              this.setFuse(f);
              if (f <= 0) {
                if (this.level() instanceof ServerLevel sl) {
                  NuclearExplosionManager.detonate(sl, this.position(), this.getNukeType());
                }
                this.discard();
              } else {
                if (this.level().isClientSide) {
                  this.level().addParticle(ParticleTypes.SMOKE, this.getX(), this.getY() + 1.05, this.getZ(), 0.0, 0.06, 0.0);
                  if (f < 25) {
                    this.level().addParticle(ParticleTypes.FLAME, this.getX(), this.getY() + 1.05, this.getZ(), 0.0, 0.04, 0.0);
                  }
                } else if (f % 10 == 0 || (f < 20 && f % 4 == 0)) {
                  this.level().playSound(null, this.blockPosition(), SoundEvents.STONE_BUTTON_CLICK_ON, SoundSource.BLOCKS, 1.4f, f < 20 ? 1.8f : 1.1f);
                }
              }
            }
            @Override
            protected void readAdditionalSaveData(CompoundTag tag) {
              setFuse(tag.getInt("Fuse"));
              setNukeType(NukeType.byId(tag.getInt("NukeType")));
            }
            @Override
            protected void addAdditionalSaveData(CompoundTag tag) {
              tag.putInt("Fuse", getFuse());
              tag.putInt("NukeType", getNukeType().id);
            }
            @Override
            public Packet<ClientGamePacketListener> getAddEntityPacket() {
              return NetworkHooks.getEntitySpawningPacket(this);
            }
          }
          """)

