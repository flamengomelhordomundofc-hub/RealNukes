name: Compilar RealNukes 1.20.1

on:
  workflow_dispatch: {}
  push: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Gerar Mod RealNukes Cinematic
        run: |
          python3 - << 'PYEOF'
          import os, zlib, struct, math, json

          def w(p, text):
            d = os.path.dirname(p)
            if d:
              os.makedirs(d, exist_ok=True)
            with open(p, 'w', encoding='utf-8') as f:
              f.write(text.lstrip('\n'))

          def png(p, W, H, fn):
            d = os.path.dirname(p)
            if d:
              os.makedirs(d, exist_ok=True)
            raw = bytearray()
            for y in range(H):
              raw.append(0)
              for x in range(W):
                r, g, b, a = fn(x, y, W, H)
                raw.extend((
                  max(0, min(255, int(r))),
                  max(0, min(255, int(g))),
                  max(0, min(255, int(b))),
                  max(0, min(255, int(a)))
                ))
            ck = lambda t, b: struct.pack('>I', len(b)) + t + b + struct.pack('>I', zlib.crc32(t + b) & 0xffffffff)
            sig = bytes([137, 80, 78, 71, 13, 10, 26, 10])
            ih = struct.pack('>IIBBBBB', W, H, 8, 6, 0, 0, 0)
            with open(p, 'wb') as f:
              f.write(sig + ck(b'IHDR', ih) + ck(b'IDAT', zlib.compress(bytes(raw), 6)) + ck(b'IEND', b''))

          def h2(x, y, s):
            return abs(math.sin(x * 127.1 + y * 311.7 + s * 74.7) * 43758.5453) % 1.0

          def vn(x, y, per, s):
            ix, iy = int(math.floor(x)), int(math.floor(y))
            fx, fy = x - ix, y - iy
            ux, uy = fx * fx * (3.0 - 2.0 * fx), fy * fy * (3.0 - 2.0 * fy)
            a, b = h2(ix % per, iy % per, s), h2((ix + 1) % per, iy % per, s)
            c, d = h2(ix % per, (iy + 1) % per, s), h2((ix + 1) % per, (iy + 1) % per, s)
            return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy

          def fbm(x, y, W, H, s):
            v, amp, per = 0.0, 0.5, 4
            for i in range(4):
              v += amp * vn(x * per / W, y * per / H, per, s + i * 17.3)
              per *= 2
              amp *= 0.5
            return v

          # --- GRADLE & METADATA ---
          w('settings.gradle', """
          pluginManagement {
            repositories {
              gradlePluginPortal()
              mavenCentral()
              maven { url = 'https://maven.minecraftforge.net/' }
            }
          }
          rootProject.name = 'realnukes'
          """)

          w('gradle.properties', """
          org.gradle.jvmargs=-Xmx3G
          org.gradle.daemon=false
          """)

          w('build.gradle', """
          plugins {
            id 'eclipse'
            id 'net.minecraftforge.gradle' version '[6.0,6.2)'
          }
          version = '1.0.0'
          group = 'com.realnukes'
          base { archivesName = 'realnukes-1.20.1' }
          java.toolchain.languageVersion = JavaLanguageVersion.of(17)
          minecraft {
            mappings channel: 'official', version: '1.20.1'
            copyIdeResources = true
          }
          dependencies {
            minecraft 'net.minecraftforge:forge:1.20.1-47.2.0'
          }
          tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
          jar {
            manifest {
              attributes([
                'Specification-Title': 'realnukes',
                'Specification-Version': '1',
                'Implementation-Title': 'realnukes',
                'Implementation-Version': '1.0.0'
              ])
            }
            finalizedBy 'reobfJar'
          }
          """)

          w('src/main/resources/pack.mcmeta', '{"pack":{"description":"RealNukes","pack_format":15}}\n')

          w('src/main/resources/META-INF/mods.toml', """
          modLoader="javafml"
          loaderVersion="[47,)"
          license="MIT"
          [[mods]]
          modId="realnukes"
          version="1.0.0"
          displayName="RealNukes Cinematic"
          description="Realistic 3D volumetric nuclear clouds and arsenal."
          [[dependencies.realnukes]]
          modId="forge"
          mandatory=true
          versionRange="[47,)"
          ordering="NONE"
          side="BOTH"
          [[dependencies.realnukes]]
          modId="minecraft"
          mandatory=true
          versionRange="[1.20.1,1.21)"
          ordering="NONE"
          side="BOTH"
          """)

          # --- TEXTURAS & MODELOS ---
          A = 'src/main/resources/assets/realnukes/'
          bombs = [
            ('tactical_nuke', (72, 88, 62), (44, 54, 38), (235, 200, 30), (80, 255, 90)),
            ('little_boy', (64, 72, 58), (36, 42, 32), (225, 185, 35), (255, 70, 50)),
            ('fat_man', (225, 190, 35), (160, 126, 20), (28, 28, 32), (255, 120, 25)),
            ('hydrogen_bomb', (85, 125, 165), (50, 76, 104), (225, 240, 255), (80, 220, 255)),
            ('tsar_bomba', (48, 52, 58), (26, 28, 34), (220, 35, 35), (255, 245, 245)),
            ('neutron_bomb', (150, 168, 182), (86, 100, 114), (35, 195, 240), (110, 245, 255)),
            ('cobalt_bomb', (58, 38, 72), (32, 20, 44), (55, 235, 95), (95, 255, 110)),
            ('antimatter_bomb', (26, 22, 34), (14, 12, 20), (175, 55, 255), (225, 120, 255)),
            ('solar_bomb', (155, 95, 30), (92, 50, 15), (255, 200, 45), (255, 245, 160))
          ]

          def bside(c1, c2, st, gl, sd):
            def f(x, y, W, H):
              n = (h2(x, y, sd) - 0.5) * 18
              if y in (0, 1, 14, 15) or x in (0, 15):
                return (c2[0] + n, c2[1] + n, c2[2] + n, 255)
              if 6 <= y <= 9:
                if 6 <= x <= 9 and 7 <= y <= 8:
                  return (gl[0], gl[1], gl[2], 255)
                return (st[0] + n * 0.4, st[1] + n * 0.4, st[2] + n * 0.4, 255) if ((x + y) // 2) % 2 == 0 else (24, 24, 28, 255)
              sh = 1.12 if x < 5 else (0.88 if x > 11 else 1.0)
              return (c1[0] * sh + n, c1[1] * sh + n, c1[2] * sh + n, 255)
            return f

          def btop(c1, c2, gl, sd):
            def f(x, y, W, H):
              r = math.hypot(x - 7.5, y - 7.5)
              n = (h2(x, y, sd + 5) - 0.5) * 16
              if r < 2.3:
                return (gl[0], gl[1], gl[2], 255)
              if r < 3.4:
                return (26, 26, 30, 255)
              return (c1[0] + n, c1[1] + n, c1[2] + n, 255) if r < 6.4 else (c2[0] + n, c2[1] + n, c2[2] + n, 255)
            return f

          for i, (nm, c1, c2, st, gl) in enumerate(bombs):
            png(A + 'textures/block/' + nm + '_side.png', 16, 16, bside(c1, c2, st, gl, i * 7 + 1))
            png(A + 'textures/block/' + nm + '_top.png', 16, 16, btop(c1, c2, gl, i * 7 + 2))
            w(A + 'blockstates/' + nm + '.json', json.dumps({'variants': {'': {'model': 'realnukes:block/' + nm}}}))
            w(A + 'models/block/' + nm + '.json', json.dumps({'parent': 'minecraft:block/cube_column', 'textures': {'end': 'realnukes:block/' + nm + '_top', 'side': 'realnukes:block/' + nm + '_side'}}))
            w(A + 'models/item/' + nm + '.json', json.dumps({'parent': 'realnukes:block/' + nm}))

          cubes = [
            ('trinitite_block', lambda x, y, W, H: (95 + fbm(x, y, 16, 16, 11) * 75, 175 + fbm(x, y, 16, 16, 11) * 70, 115 + fbm(x, y, 16, 16, 11) * 55, 255), False),
            ('radioactive_ash', lambda x, y, W, H: (155, 205, 70, 255) if fbm(x, y, 16, 16, 22) > 0.72 else (30 + fbm(x, y, 16, 16, 22) * 44, 28 + fbm(x, y, 16, 16, 22) * 42, 26 + fbm(x, y, 16, 16, 22) * 40, 255), False),
            ('lead_bunker_block', lambda x, y, W, H: (44, 48, 56, 255) if (x in (0, 15) or y in (0, 15) or x == y or x + y == 15) else (76 + (h2(x, y, 51) - 0.5) * 16, 82 + (h2(x, y, 51) - 0.5) * 16, 92 + (h2(x, y, 51) - 0.5) * 16, 255), False),
            ('reinforced_bunker_glass', lambda x, y, W, H: (48, 54, 62, 255) if (x in (0, 1, 14, 15) or y in (0, 1, 14, 15)) else ((215, 240, 250, 175) if (x - y) in (3, 4) else (140, 185, 208, 92)), True)
          ]
          for nm, fn, gl in cubes:
            png(A + 'textures/block/' + nm + '.png', 16, 16, fn)
            w(A + 'blockstates/' + nm + '.json', json.dumps({'variants': {'': {'model': 'realnukes:block/' + nm}}}))
            mdl = {'parent': 'minecraft:block/cube_all', 'textures': {'all': 'realnukes:block/' + nm}}
            if gl:
              mdl['render_type'] = 'translucent'
            w(A + 'models/block/' + nm + '.json', json.dumps(mdl))
            w(A + 'models/item/' + nm + '.json', json.dumps({'parent': 'realnukes:block/' + nm}))

          its = [
            ('mini_nuke_grenade', lambda x, y, W, H: (230, 55, 45, 255) if (6 <= x <= 9 and 2 <= y <= 4) else (((235, 200, 35, 255) if x % 2 == 0 else (28, 28, 30, 255)) if (5 <= x <= 10 and y in (7, 8)) else ((72, 92, 62, 255) if (5 <= x <= 10 and 5 <= y <= 11) else ((52, 60, 48, 255) if (4 <= x <= 11 and 12 <= y <= 13) else (0, 0, 0, 0))))),
            ('orbital_designator', lambda x, y, W, H: (255, 45, 45, 255) if (6 <= x <= 9 and 6 <= y <= 8) else ((65, 235, 130, 255) if (5 <= x <= 10 and 10 <= y <= 11) else ((54, 62, 74, 255) if (3 <= x <= 12 and 5 <= y <= 12) else ((210, 220, 230, 255) if (7 <= x <= 8 and 1 <= y <= 4) else (0, 0, 0, 0))))),
            ('remote_detonator', lambda x, y, W, H: (185, 195, 205, 255) if (x == 11 and 1 <= y <= 6) else ((235, 35, 35, 255) if (6 <= x <= 9 and 8 <= y <= 10) else ((70, 255, 95, 255) if (x == 5 and y == 7) else ((72, 76, 84, 255) if (4 <= x <= 12 and 6 <= y <= 14) else (0, 0, 0, 0))))),
            ('geiger_counter', lambda x, y, W, H: (220, 35, 35, 255) if (x == 7 and y == 8) else ((220, 240, 215, 255) if (5 <= x <= 9 and 7 <= y <= 9) else ((235, 195, 30, 255) if (3 <= x <= 11 and 5 <= y <= 14) else ((45, 48, 52, 255) if (x == 13 and 2 <= y <= 12) else (0, 0, 0, 0))))),
            ('antirad_pill', lambda x, y, W, H: ((230, 55, 65, 255) if (x - y) < 0 else (238, 248, 255, 255)) if (abs((x - 7.5) + (y - 7.5)) <= 2.4 and abs((x - 7.5) - (y - 7.5)) <= 4.2) else (0, 0, 0, 0)),
            ('hazmat_helmet', lambda x, y, W, H: (32, 42, 54, 255) if (5 <= x <= 10 and 6 <= y <= 9) else ((238, 202, 28, 255) if (3 <= x <= 12 and 3 <= y <= 12) else (0, 0, 0, 0))),
            ('hazmat_chestplate', lambda x, y, W, H: (38, 38, 42, 255) if (y == 11 and 4 <= x <= 11) else ((238, 202, 28, 255) if ((2 <= x <= 13 and 3 <= y <= 7) or (4 <= x <= 11 and 3 <= y <= 13)) else (0, 0, 0, 0))),
            ('hazmat_leggings', lambda x, y, W, H: (40, 40, 44, 255) if (y == 3 and 4 <= x <= 11) else ((232, 194, 26, 255) if ((4 <= x <= 11 and 3 <= y <= 6) or (4 <= x <= 7 and 6 <= y <= 13) or (8 <= x <= 11 and 6 <= y <= 13)) else (0, 0, 0, 0))),
            ('hazmat_boots', lambda x, y, W, H: (34, 36, 40, 255) if (y >= 11 and ((3 <= x <= 6) or (9 <= x <= 12)) and y <= 13) else ((230, 192, 25, 255) if (7 <= y <= 10 and ((3 <= x <= 6) or (9 <= x <= 12))) else (0, 0, 0, 0)))
          ]
          for nm, fn in its:
            png(A + 'textures/item/' + nm + '.png', 16, 16, fn)
            w(A + 'models/item/' + nm + '.json', json.dumps({'parent': 'minecraft:item/generated', 'textures': {'layer0': 'realnukes:item/' + nm}}))

          png(A + 'textures/models/armor/hazmat_layer_1.png', 64, 32, lambda x, y, W, H: (28, 38, 48, 255) if (9 <= x <= 14 and 10 <= y <= 13) else ((34, 36, 40, 255) if y >= 27 else (236, 198, 28, 255)))
          png(A + 'textures/models/armor/hazmat_layer_2.png', 64, 32, lambda x, y, W, H: (42, 42, 46, 255) if y in (16, 17, 24, 25) else (226, 188, 24, 255))

          # --- ATLAS VOLUMETRICO 128x128 (4 TILES COUVE-FLOR + fBm) ---
          lobes = [
            [(0.0, 0.0, 0.56), (-0.32, -0.16, 0.40), (0.34, -0.12, 0.42), (-0.18, 0.32, 0.38), (0.26, 0.28, 0.36), (0.02, -0.34, 0.35), (-0.38, 0.16, 0.32), (0.38, 0.12, 0.30)],
            [(0.04, -0.04, 0.54), (-0.34, 0.08, 0.42), (0.30, -0.24, 0.40), (-0.14, -0.34, 0.38), (0.34, 0.20, 0.38), (-0.22, 0.34, 0.34), (0.08, 0.36, 0.32), (-0.40, -0.18, 0.28)],
            [(-0.04, 0.02, 0.55), (0.32, -0.18, 0.42), (-0.30, -0.26, 0.38), (0.22, 0.32, 0.40), (-0.32, 0.24, 0.36), (0.04, -0.36, 0.34), (0.40, 0.04, 0.30), (-0.08, 0.38, 0.32)],
            [(0.0, 0.04, 0.54), (-0.28, -0.24, 0.42), (0.36, 0.02, 0.40), (-0.36, 0.14, 0.38), (0.16, -0.34, 0.36), (0.24, 0.32, 0.36), (-0.16, 0.34, 0.34), (0.0, -0.22, 0.42)]
          ]

          def eval_billow(u, v, tid):
            h = 0.0
            for cx, cy, cr in lobes[tid]:
              d = 1.0 - math.hypot(u - cx, v - cy) / cr
              if d > 0:
                s = d * d * (3.0 - 2.0 * d)
                if s > h:
                  h = s
            return h

          def mk_atlas(x, y, W, H):
            tx, ty = x // 64, y // 64
            tid = ty * 2 + tx
            u = ((x % 64) / 63.0) * 2.0 - 1.0
            v = ((y % 64) / 63.0) * 2.0 - 1.0
            rad = math.hypot(u, v)
            if rad >= 0.98:
              return (255, 255, 255, 0)
            h0 = eval_billow(u, v, tid)
            hx = eval_billow(u + 0.04, v, tid) - h0
            hy = eval_billow(u, v + 0.04, tid) - h0
            tb = fbm(x % 64, y % 64, 64, 64, tid * 31.0 + 13.0)
            tb2 = fbm((x % 64) * 2, (y % 64) * 2, 64, 64, tid * 47.0 + 5.0)
            dens = h0 + 0.34 * (tb - 0.45) + 0.14 * (tb2 - 0.5)
            edge = max(0.0, min(1.0, (0.98 - rad) / 0.44))
            edge = edge * edge * (3.0 - 2.0 * edge)
            a = max(0.0, min(1.0, (dens - 0.12) * 2.6)) * edge
            lit = max(0.42, min(1.0, 0.74 - hx * 2.4 + hy * 2.8 + (tb - 0.5) * 0.28 - v * 0.18))
            c = lit * 255.0
            return (c, c * 0.99, c * 0.97, a * 235.0)

          png(A + 'textures/entity/volumetric_cloud.png', 128, 128, mk_atlas)

          def mk_fire(x, y, W, H):
            u = (x / 63.0) * 2.0 - 1.0
            v = (y / 63.0) * 2.0 - 1.0
            r = math.hypot(u, v)
            if r >= 1.0:
              return (255, 200, 100, 0)
            n = fbm(x, y, 64, 64, 99.0)
            f = max(0.0, 1.0 - r * r)
            a = (f ** 1.6) * (0.55 + 0.45 * n) * 255.0
            return (255, 155 + f * 100, 45 + (f ** 2) * 200, a)

          png(A + 'textures/entity/fireball_core.png', 64, 64, mk_fire)

          def mk_ring(x, y, W, H):
            n = fbm(x, y, 64, 64, 123.0)
            e = math.sin(math.pi * y / 63.0)
            return (248, 250, 255, (110 + n * 110) * (e ** 0.85))

          png(A + 'textures/entity/shockwave_ring.png', 64, 64, mk_ring)
          png(A + 'textures/entity/missile.png', 32, 32, lambda x, y, W, H: (225, 40, 40, 255) if y < 8 else (((240, 200, 30, 255) if ((x // 4) % 2 == 0) else (24, 24, 28, 255)) if 12 <= y <= 16 else (205, 212, 222, 255)))

          pt = {
            'itemGroup.realnukes': 'RealNukes - Arsenal Nuclear',
            'block.realnukes.tactical_nuke': 'Mini-Nuke Tatica',
            'block.realnukes.little_boy': 'Bomba Little Boy',
            'block.realnukes.fat_man': 'Bomba Fat Man',
            'block.realnukes.hydrogen_bomb': 'Bomba Termonuclear H',
            'block.realnukes.tsar_bomba': 'Tsar Bomba 50MT',
            'block.realnukes.neutron_bomb': 'Bomba de Neutrons',
            'block.realnukes.cobalt_bomb': 'Bomba de Cobalto',
            'block.realnukes.antimatter_bomb': 'Bomba de Antimateria',
            'block.realnukes.solar_bomb': 'Bomba de Plasma Solar',
            'block.realnukes.trinitite_block': 'Vidro de Trinitita',
            'block.realnukes.radioactive_ash': 'Cinza Radioativa',
            'block.realnukes.lead_bunker_block': 'Bloco Bunker de Chumbo',
            'block.realnukes.reinforced_bunker_glass': 'Vidro Blindado de Bunker',
            'item.realnukes.mini_nuke_grenade': 'Granada Mini-Nuke',
            'item.realnukes.orbital_designator': 'Ataque Orbital Missil',
            'item.realnukes.remote_detonator': 'Detonador Remoto',
            'item.realnukes.geiger_counter': 'Contador Geiger',
            'item.realnukes.antirad_pill': 'Pilula Rad-X',
            'item.realnukes.hazmat_helmet': 'Capacete Hazmat',
            'item.realnukes.hazmat_chestplate': 'Peitoral Hazmat',
            'item.realnukes.hazmat_leggings': 'Calca Hazmat',
            'item.realnukes.hazmat_boots': 'Botas Hazmat'
          }
          w(A + 'lang/pt_br.json', json.dumps(pt, indent=2))
          w(A + 'lang/en_us.json', json.dumps(pt, indent=2))

          J = 'src/main/java/com/realnukes/'

          # --- RealNukesMod.java ---
          w(J + 'RealNukesMod.java', """
          package com.realnukes;
          import java.util.List;
          import java.util.Locale;
          import javax.annotation.Nullable;
          import net.minecraft.ChatFormatting;
          import net.minecraft.core.BlockPos;
          import net.minecraft.core.registries.Registries;
          import net.minecraft.nbt.CompoundTag;
          import net.minecraft.network.chat.Component;
          import net.minecraft.server.level.ServerLevel;
          import net.minecraft.sounds.SoundEvent;
          import net.minecraft.sounds.SoundEvents;
          import net.minecraft.sounds.SoundSource;
          import net.minecraft.world.InteractionHand;
          import net.minecraft.world.InteractionResult;
          import net.minecraft.world.InteractionResultHolder;
          import net.minecraft.world.effect.MobEffectInstance;
          import net.minecraft.world.effect.MobEffects;
          import net.minecraft.world.entity.EntityType;
          import net.minecraft.world.entity.EquipmentSlot;
          import net.minecraft.world.entity.LivingEntity;
          import net.minecraft.world.entity.MobCategory;
          import net.minecraft.world.entity.player.Player;
          import net.minecraft.world.food.FoodProperties;
          import net.minecraft.world.item.ArmorItem;
          import net.minecraft.world.item.ArmorMaterial;
          import net.minecraft.world.item.BlockItem;
          import net.minecraft.world.item.CreativeModeTab;
          import net.minecraft.world.item.Item;
          import net.minecraft.world.item.ItemStack;
          import net.minecraft.world.item.Items;
          import net.minecraft.world.item.TooltipFlag;
          import net.minecraft.world.item.context.UseOnContext;
          import net.minecraft.world.item.crafting.Ingredient;
          import net.minecraft.world.level.BlockGetter;
          import net.minecraft.world.level.ClipContext;
          import net.minecraft.world.level.Explosion;
          import net.minecraft.world.level.Level;
          import net.minecraft.world.level.block.Block;
          import net.minecraft.world.level.block.GlassBlock;
          import net.minecraft.world.level.block.SoundType;
          import net.minecraft.world.level.block.state.BlockBehaviour;
          import net.minecraft.world.level.block.state.BlockState;
          import net.minecraft.world.level.material.MapColor;
          import net.minecraft.world.phys.BlockHitResult;
          import net.minecraft.world.phys.HitResult;
          import net.minecraft.world.phys.Vec3;
          import net.minecraftforge.eventbus.api.IEventBus;
          import net.minecraftforge.fml.common.Mod;
          import net.minecraftforge.fml.javafmlmod.FMLJavaModLoadingContext;
          import net.minecraftforge.registries.DeferredRegister;
          import net.minecraftforge.registries.ForgeRegistries;
          import net.minecraftforge.registries.RegistryObject;

          @Mod(RealNukesMod.MODID)
          public class RealNukesMod {
            public static final String MODID = "realnukes";

            public enum NukeType {
              TACTICAL(0, 26, 56f, 26f, 540, 0.78f, 4.8f, 44, 45, 1.0f, 0.56f, 0.16f, 0.76f, 0.72f, 0.68f, 1, true, false, false, false),
              LITTLE_BOY(1, 40, 92f, 42f, 720, 0.94f, 7.6f, 68, 70, 1.0f, 0.48f, 0.12f, 0.78f, 0.72f, 0.66f, 1, true, false, false, false),
              FAT_MAN(2, 50, 108f, 50f, 800, 1.0f, 9.2f, 82, 85, 1.0f, 0.44f, 0.10f, 0.76f, 0.69f, 0.62f, 2, true, false, false, false),
              HYDROGEN(3, 66, 148f, 68f, 960, 1.0f, 12.0f, 106, 105, 1.0f, 0.66f, 0.24f, 0.88f, 0.84f, 0.80f, 2, true, false, false, false),
