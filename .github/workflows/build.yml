              if (trans < 0.025 || td >= tEnd) break;
              vec3 p = ro + rd * td;
              if (p.y < -1.5) break;

              vec4 s = sampleCloud(p, t, H, R, prog, rings, fbY, fbR, true);
              float dSm = s.x * fade;
              float dWl = s.z * fade;
              float totD = dSm + dWl;

              if (totD < 0.003) {
                td += max(baseStep, max(s.w - R * 0.30, 0.0) * 0.72);
                continue;
              }

              float sh1 = sampleCloud(p + sunDir * (R * 0.12), t, H, R, prog, 0.0, fbY, fbR, false).x;
              float sh2 = sampleCloud(p + sunDir * (R * 0.42), t, H, R, prog, 0.0, fbY, fbR, false).x;
              float opt = (sh1 * 0.55 + sh2 * 0.95) * 2.2;
              float sunMs = 0.68 * exp(-opt * 2.1) + 0.32 * exp(-opt * 0.42);
              float powder = 1.0 - exp(-dSm * baseStep * ext * 2.8);
              float hF = clamp(p.y / max(H * 1.25, 1.0), 0.0, 1.0);

              vec3 dirtTint = mix(vec3(0.74, 0.66, 0.58), vec3(1.04, 1.01, 0.98), smoothstep(0.18, 0.68, hF));
              vec3 sunCol = vec3(1.55, 1.38, 1.16) * sunBr;
              vec3 skyAmb = mix(vec3(0.06, 0.07, 0.10), vec3(0.36, 0.44, 0.56), hF) * sunBr;
              float gD = length(p - vec3(0.0, fbY * 0.72, 0.0)) / max(R * 1.55, 1.0);
              vec3 bounce = FireCol * exp(-gD * 1.4) * earlyGlow * 0.95 * (1.0 - hF * 0.55);
              vec3 smLit = SmokeCol * dirtTint * (skyAmb + sunCol * sunMs * hg * mix(0.55, 1.45, powder)) + bounce;

              vec3 bb = blackbody(s.y);
              vec3 fCol = mix(bb, FireCol * max(s.y * 1.75, 0.0), isExotic * 0.72);
              vec3 emit = fCol * smoothstep(0.04, 0.92, s.y) * 3.8;

              vec3 wCol = vec3(0.96, 0.98, 1.0) * sunBr * (0.52 + 0.55 * sunMs);
              float wM = dWl / max(totD, 0.0001);
              vec3 sCol = mix(smLit + emit, wCol, wM);

              float stepA = 1.0 - exp(-totD * baseStep * ext);
              accum += trans * sCol * stepA;
              trans *= (1.0 - stepA);
              td += baseStep;
