name: Compilar RealNukes 1.20.1

on:
  workflow_dispatch: {}
  push: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Gerar Mod RealNukes Completo
        run: |
          python3 - << 'PYEOF'
          import os, zlib, struct, math, json

          def w(p, text):
            d = os.path.dirname(p)
            if d:
              os.makedirs(d, exist_ok=True)
            with open(p, 'w', encoding='utf-8') as f:
              f.write(text.lstrip('\n'))

          def save_png(p, width, height, fn):
            d = os.path.dirname(p)
            if d:
              os.makedirs(d, exist_ok=True)
            raw = bytearray()
            for y in range(height):
              raw.append(0)
              for x in range(width):
                r, g, b, a = fn(x, y, width, height)
                raw.extend((
                  max(0, min(255, int(r))),
                  max(0, min(255, int(g))),
                  max(0, min(255, int(b))),
                  max(0, min(255, int(a)))
                ))
            def ck(t, data):
              return struct.pack('>I', len(data)) + t + data + struct.pack('>I', zlib.crc32(t + data) & 0xffffffff)
            ihdr = struct.pack('>IIBBBBB', width, height, 8, 6, 0, 0, 0)
            sig = bytes([137, 80, 78, 71, 13, 10, 26, 10])
            png = sig + ck(b'IHDR', ihdr) + ck(b'IDAT', zlib.compress(bytes(raw), 6)) + ck(b'IEND', b'')
            with open(p, 'wb') as f:
              f.write(png)

          def h2(x, y, s):
            return abs(math.sin(x * 127.1 + y * 311.7 + s * 74.7) * 43758.5453) % 1.0

          def vnoise(x, y, per, s):
            ix = int(math.floor(x))
            iy = int(math.floor(y))
            fx = x - ix
            fy = y - iy
            ux = fx * fx * (3.0 - 2.0 * fx)
            uy = fy * fy * (3.0 - 2.0 * fy)
            a = h2(ix % per, iy % per, s)
            b = h2((ix + 1) % per, iy % per, s)
            c = h2(ix % per, (iy + 1) % per, s)
            d = h2((ix + 1) % per, (iy + 1) % per, s)
            return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy

          def fbm(x, y, w0, h0, s):
            v = 0.0
            amp = 0.5
            per = 4
            for i in range(4):
              v += amp * vnoise(x * per / w0, y * per / h0, per, s + i * 19.3)
              per *= 2
              amp *= 0.5
            return v

          # --- GRADLE & METADATA ---
          w('settings.gradle', """
          pluginManagement {
            repositories {
              gradlePluginPortal()
              mavenCentral()
              maven { url = 'https://maven.minecraftforge.net/' }
            }
          }
          rootProject.name = 'realnukes'
          """)

          w('gradle.properties', """
          org.gradle.jvmargs=-Xmx3G
          org.gradle.daemon=false
          """)

          w('build.gradle', """
          plugins {
            id 'eclipse'
            id 'idea'
            id 'net.minecraftforge.gradle' version '[6.0,6.2)'
          }
          version = '1.0.0'
          group = 'com.realnukes'
          base { archivesName = 'realnukes-1.20.1' }
          java.toolchain.languageVersion = JavaLanguageVersion.of(17)
          minecraft {
            mappings channel: 'official', version: '1.20.1'
            copyIdeResources = true
          }
          dependencies {
            minecraft 'net.minecraftforge:forge:1.20.1-47.2.0'
          }
          tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
          jar {
            manifest {
              attributes([
                'Specification-Title': 'realnukes',
                'Specification-Vendor': 'realnukes',
                'Specification-Version': '1',
                'Implementation-Title': 'realnukes',
                'Implementation-Version': '1.0.0',
                'Implementation-Vendor': 'realnukes'
              ])
            }
            finalizedBy 'reobfJar'
          }
          """)

          w('src/main/resources/pack.mcmeta', '{"pack":{"description":"RealNukes Resources","pack_format":15}}\n')

          w('src/main/resources/META-INF/mods.toml', """
          modLoader="javafml"
          loaderVersion="[47,)"
          license="MIT"
          [[mods]]
          modId="realnukes"
          version="1.0.0"
          displayName="RealNukes - Cinematic Nuclear Mod"
          description="Realistic and cinematic nuclear bombs with 3D volumetric mushroom clouds."
          [[dependencies.realnukes]]
          modId="forge"
          mandatory=true
          versionRange="[47,)"
          ordering="NONE"
          side="BOTH"
          [[dependencies.realnukes]]
          modId="minecraft"
          mandatory=true
          versionRange="[1.20.1,1.21)"
          ordering="NONE"
          side="BOTH"
          """)

          # --- TEXTURAS & MODELOS ---
          bombs = [
            ('tactical_nuke', (72, 88, 62), (46, 56, 40), (235, 200, 30), (80, 255, 90)),
            ('little_boy', (64, 72, 58), (38, 44, 34), (225, 185, 35), (255, 70, 50)),
            ('fat_man', (225, 190, 35), (165, 130, 20), (30, 30, 34), (255, 120, 25)),
            ('hydrogen_bomb', (85, 125, 165), (52, 78, 108), (220, 235, 250), (80, 220, 255)),
            ('tsar_bomba', (48, 52, 58), (28, 30, 36), (220, 35, 35), (255, 240, 240)),
            ('neutron_bomb', (150, 168, 182), (88, 102, 116), (35, 195, 240), (110, 245, 255)),
            ('cobalt_bomb', (58, 38, 72), (32, 20, 44), (55, 235, 95), (95, 255, 110)),
            ('antimatter_bomb', (26, 22, 34), (14, 12, 20), (175, 55, 255), (225, 120, 255)),
            ('solar_bomb', (155, 95, 30), (95, 52, 15), (255, 200, 45), (255, 245, 160))
          ]

          def make_bomb_side(c1, c2, st, gl, seed):
            def fn(x, y, w0, h0):
              n = (h2(x, y, seed) - 0.5) * 18
              if y in (0, 1, 14, 15) or x in (0, 15):
                return (c2[0] + n, c2[1] + n, c2[2] + n, 255)
              if y in (2, 13) and x in (2, 5, 10, 13):
                return (c2[0] * 0.65, c2[1] * 0.65, c2[2] * 0.65, 255)
              if 6 <= y <= 9:
                if 6 <= x <= 9 and 7 <= y <= 8:
                  return (gl[0], gl[1], gl[2], 255)
                if ((x + y) // 2) % 2 == 0:
                  return (st[0] + n * 0.5, st[1] + n * 0.5, st[2] + n * 0.5, 255)
                return (24 + n * 0.3, 24 + n * 0.3, 28 + n * 0.3, 255)
              sh = 1.0 + (0.14 if x < 5 else (-0.14 if x > 11 else 0.0))
              return (c1[0] * sh + n, c1[1] * sh + n, c1[2] * sh + n, 255)
            return fn

          def make_bomb_top(c1, c2, gl, seed):
            def fn(x, y, w0, h0):
              dx = x - 7.5
              dy = y - 7.5
              r = math.sqrt(dx * dx + dy * dy)
              n = (h2(x, y, seed + 5) - 0.5) * 16
              if r < 2.3:
                return (gl[0], gl[1], gl[2], 255)
              if r < 3.4:
                return (28, 28, 32, 255)
              if r < 6.4:
                if abs(dx) < 0.8 or abs(dy) < 0.8:
                  return (c2[0] + n, c2[1] + n, c2[2] + n, 255)
                return (c1[0] + n, c1[1] + n, c1[2] + n, 255)
              return (c2[0] + n, c2[1] + n, c2[2] + n, 255)
            return fn

          for idx, (nm, c1, c2, st, gl) in enumerate(bombs):
            save_png('src/main/resources/assets/realnukes/textures/block/' + nm + '_side.png', 16, 16, make_bomb_side(c1, c2, st, gl, idx * 7 + 1))
            save_png('src/main/resources/assets/realnukes/textures/block/' + nm + '_top.png', 16, 16, make_bomb_top(c1, c2, gl, idx * 7 + 2))
            w('src/main/resources/assets/realnukes/blockstates/' + nm + '.json', json.dumps({'variants': {'': {'model': 'realnukes:block/' + nm}}}))
            w('src/main/resources/assets/realnukes/models/block/' + nm + '.json', json.dumps({'parent': 'minecraft:block/cube_column', 'textures': {'end': 'realnukes:block/' + nm + '_top', 'side': 'realnukes:block/' + nm + '_side'}}))
            w('src/main/resources/assets/realnukes/models/item/' + nm + '.json', json.dumps({'parent': 'realnukes:block/' + nm}))

          def mk_trinitite(x, y, w0, h0):
            v = fbm(x, y, 16, 16, 11.0)
            sp = 45 if ((x + y) % 7 == 0 and v > 0.55) else 0
            return (95 + v * 70 + sp, 175 + v * 65 + sp, 115 + v * 50 + sp, 255)

          def mk_ash(x, y, w0, h0):
            v = fbm(x, y, 16, 16, 22.0)
            if v > 0.72:
              return (160, 210, 75, 255)
            c = 28 + v * 46
            return (c + 6, c + 4, c, 255)

          def mk_uranium(x, y, w0, h0):
            n = (h2(x, y, 31) - 0.5) * 20
            if x in (0, 15) or y in (0, 15):
              return (45 + n, 80 + n, 45 + n, 255)
            if (x in (4, 5, 10, 11) and y in (4, 5, 10, 11)) or (6 <= x <= 9 and 6 <= y <= 9):
              return (110 + n, 245, 95 + n, 255)
            return (62 + n, 145 + n, 65 + n, 255)

          def mk_plutonium(x, y, w0, h0):
            dx = x - 7.5
            dy = y - 7.5
            r = math.sqrt(dx * dx + dy * dy)
            n = (h2(x, y, 41) - 0.5) * 18
            if r < 3.6:
              return (145, 240, 255, 255)
            if r < 5.5:
              return (45, 155, 235, 255)
            if x in (0, 15) or y in (0, 15):
              return (42 + n, 52 + n, 68 + n, 255)
            return (74 + n, 88 + n, 106 + n, 255)

          def mk_bunker(x, y, w0, h0):
            n = (h2(x, y, 51) - 0.5) * 16
            if x in (0, 15) or y in (0, 15):
              return (42 + n, 46 + n, 54 + n, 255)
            if (x in (2, 13) and y in (2, 13)) or abs(x - y) == 0 or abs(x + y - 15) == 0:
              return (54 + n, 58 + n, 66 + n, 255)
            return (76 + n, 82 + n, 92 + n, 255)

          def mk_bglass(x, y, w0, h0):
            if x in (0, 1, 14, 15) or y in (0, 1, 14, 15):
              return (48, 54, 62, 255)
            if (x in (2, 13) and y in (2, 13)):
              return (88, 96, 108, 255)
            if (x - y) in (3, 4) and 3 <= x <= 11:
              return (215, 240, 250, 175)
            return (145, 190, 210, 95)

          cubes = [
            ('trinitite_block', mk_trinitite, False),
            ('radioactive_ash', mk_ash, False),
            ('uranium_ore_block', mk_uranium, False),
            ('plutonium_core_block', mk_plutonium, False),
            ('lead_bunker_block', mk_bunker, False),
            ('reinforced_bunker_glass', mk_bglass, True)
          ]
          for nm, fn, is_glass in cubes:
            save_png('src/main/resources/assets/realnukes/textures/block/' + nm + '.png', 16, 16, fn)
            w('src/main/resources/assets/realnukes/blockstates/' + nm + '.json', json.dumps({'variants': {'': {'model': 'realnukes:block/' + nm}}}))
            mdl = {'parent': 'minecraft:block/cube_all', 'textures': {'all': 'realnukes:block/' + nm}}
            if is_glass:
              mdl['render_type'] = 'translucent'
            w('src/main/resources/assets/realnukes/models/block/' + nm + '.json', json.dumps(mdl))
            w('src/main/resources/assets/realnukes/models/item/' + nm + '.json', json.dumps({'parent': 'realnukes:block/' + nm}))

          def mk_grenade(x, y, w0, h0):
            if 6 <= x <= 9 and 2 <= y <= 4:
              return (230, 55, 45, 255)
            if 5 <= x <= 10 and 5 <= y <= 11:
              if y in (7, 8):
                return (235, 200, 35, 255) if (x % 2 == 0) else (28, 28, 30, 255)
              return (72, 92, 62, 255)
            if (x in (4, 11) and 10 <= y <= 13) or (6 <= x <= 9 and 12 <= y <= 13):
              return (52, 60, 48, 255)
            return (0, 0, 0, 0)

          def mk_orbital(x, y, w0, h0):
            if 3 <= x <= 12 and 5 <= y <= 12:
              if 6 <= x <= 9 and 6 <= y <= 8:
                return (255, 45, 45, 255)
              if 5 <= x <= 10 and 10 <= y <= 11:
                return (65, 235, 130, 255)
              return (54, 62, 74, 255)
            if 7 <= x <= 8 and 1 <= y <= 4:
              return (200, 210, 220, 255)
            if x == 7 and y == 1:
              return (255, 60, 60, 255)
            return (0, 0, 0, 0)

          def mk_remote(x, y, w0, h0):
            if x == 11 and 1 <= y <= 6:
              return (180, 190, 200, 255)
            if 4 <= x <= 12 and 6 <= y <= 14:
              if 6 <= x <= 9 and 8 <= y <= 10:
                return (235, 35, 35, 255)
              if x == 5 and y == 7:
                return (70, 255, 95, 255)
              return (72, 76, 84, 255)
            return (0, 0, 0, 0)

          def mk_geiger(x, y, w0, h0):
            if 3 <= x <= 11 and 5 <= y <= 14:
              if 5 <= x <= 9 and 7 <= y <= 9:
                return (220, 240, 215, 255) if not (x == 7 and y == 8) else (220, 35, 35, 255)
              if y == 12 and x in (5, 7, 9):
                return (30, 30, 32, 255)
              return (235, 195, 30, 255)
            if (x == 13 and 2 <= y <= 12) or (x == 12 and y == 12):
              return (45, 48, 52, 255)
            return (0, 0, 0, 0)

          def mk_pill(x, y, w0, h0):
            d = abs((x - 7.5) + (y - 7.5))
            t = (x - 7.5) - (y - 7.5)
            if d <= 2.4 and abs(t) <= 4.2:
              if t < 0:
                return (230, 55, 65, 255)
              return (235, 248, 255, 255)
            return (0, 0, 0, 0)

          def mk_h_helm(x, y, w0, h0):
            if 3 <= x <= 12 and 3 <= y <= 12:
              if 5 <= x <= 10 and 6 <= y <= 9:
                return (32, 42, 54, 255) if not (x == 6 and y == 7) else (120, 175, 200, 255)
              if y == 11 and 6 <= x <= 9:
                return (38, 38, 42, 255)
              return (238, 202, 28, 255)
            return (0, 0, 0, 0)

          def mk_h_chest(x, y, w0, h0):
            if (2 <= x <= 13 and 3 <= y <= 7) or (4 <= x <= 11 and 3 <= y <= 13):
              if 6 <= x <= 9 and 5 <= y <= 8:
                return (34, 34, 38, 255) if (x + y) % 2 == 0 else (238, 202, 28, 255)
              if y == 11:
                return (40, 40, 44, 255)
              return (238, 202, 28, 255)
            return (0, 0, 0, 0)

          def mk_h_legs(x, y, w0, h0):
            if (4 <= x <= 11 and 3 <= y <= 6) or (4 <= x <= 7 and 6 <= y <= 13) or (8 <= x <= 11 and 6 <= y <= 13):
              if y == 3 or y == 10:
                return (40, 40, 44, 255)
              return (232, 194, 26, 255)
            return (0, 0, 0, 0)

          def mk_h_boots(x, y, w0, h0):
            if (3 <= x <= 6 and 7 <= y <= 13) or (9 <= x <= 12 and 7 <= y <= 13):
              if y >= 11:
                return (34, 36, 40, 255)
              return (230, 192, 25, 255)
            return (0, 0, 0, 0)

          items = [
            ('mini_nuke_grenade', mk_grenade),
            ('orbital_designator', mk_orbital),
            ('remote_detonator', mk_remote),
            ('geiger_counter', mk_geiger),
            ('antirad_pill', mk_pill),
            ('hazmat_helmet', mk_h_helm),
            ('hazmat_chestplate', mk_h_chest),
            ('hazmat_leggings', mk_h_legs),
            ('hazmat_boots', mk_h_boots)
          ]
          for nm, fn in items:
            save_png('src/main/resources/assets/realnukes/textures/item/' + nm + '.png', 16, 16, fn)
            w('src/main/resources/assets/realnukes/models/item/' + nm + '.json', json.dumps({'parent': 'minecraft:item/generated', 'textures': {'layer0': 'realnukes:item/' + nm}}))

          def mk_arm1(x, y, w0, h0):
            if 9 <= x <= 14 and 10 <= y <= 13:
              return (28, 38, 48, 255)
            if 20 <= x <= 27 and 27 <= y <= 29:
              return (36, 36, 40, 255)
            if 0 <= x <= 15 and 26 <= y <= 31:
              return (34, 36, 40, 255)
            return (236, 198, 28, 255)

          def mk_arm2(x, y, w0, h0):
            if y in (16, 17, 24, 25):
              return (42, 42, 46, 255)
            return (226, 188, 24, 255)

          save_png('src/main/resources/assets/realnukes/textures/models/armor/hazmat_layer_1.png', 64, 32, mk_arm1)
          save_png('src/main/resources/assets/realnukes/textures/models/armor/hazmat_layer_2.png', 64, 32, mk_arm2)

          def mk_cloud_tex(x, y, w0, h0):
            v = fbm(x, y, w0, h0, 77.0)
            c = 175 + v * 80
            return (c, c, c, 215 + v * 40)

          def mk_fire_tex(x, y, w0, h0):
            v = fbm(x, y, w0, h0, 99.0)
            return (255, 165 + v * 90, 55 + v * 175, 220 + v * 35)

          def mk_ring_tex(x, y, w0, h0):
            v = fbm(x, y, w0, h0, 123.0)
            e = math.sin(math.pi * y / h0)
            return (245, 248, 255, (140 + v * 90) * (e ** 0.7))

          def mk_missile_tex(x, y, w0, h0):
            if y < 8:
              return (225, 40, 40, 255)
            if 12 <= y <= 16:
              return (240, 200, 30, 255) if ((x // 4) % 2 == 0) else (25, 25, 28, 255)
            return (205, 212, 222, 255)

          save_png('src/main/resources/assets/realnukes/textures/entity/volumetric_cloud.png', 64, 64, mk_cloud_tex)
          save_png('src/main/resources/assets/realnukes/textures/entity/fireball_core.png', 64, 64, mk_fire_tex)
          save_png('src/main/resources/assets/realnukes/textures/entity/shockwave_ring.png', 64, 64, mk_ring_tex)
          save_png('src/main/resources/assets/realnukes/textures/entity/missile.png', 32, 32, mk_missile_tex)

          # --- IDIOMAS ---
          pt = {
            'itemGroup.realnukes': 'RealNukes - Arsenal Nuclear',
            'block.realnukes.tactical_nuke': 'Mini-Nuke Tatica',
            'block.realnukes.little_boy': 'Bomba Nuclear Little Boy',
            'block.realnukes.fat_man': 'Bomba de Plutonio Fat Man',
            'block.realnukes.hydrogen_bomb': 'Bomba Termonuclear de Hidrogenio',
            'block.realnukes.tsar_bomba': 'Tsar Bomba (50 Megatons)',
            'block.realnukes.neutron_bomb': 'Bomba de Neutrons (Pulso Rad)',
            'block.realnukes.cobalt_bomb': 'Bomba de Cobalto Juizo Final',
            'block.realnukes.antimatter_bomb': 'Bomba de Antimateria',
            'block.realnukes.solar_bomb': 'Bomba de Plasma Solar',
            'block.realnukes.trinitite_block': 'Vidro de Trinitita',
            'block.realnukes.radioactive_ash': 'Cinza Radioativa',
            'block.realnukes.uranium_ore_block': 'Bloco de Uranio Enriquecido',
            'block.realnukes.plutonium_core_block': 'Nucleo de Plutonio',
            'block.realnukes.lead_bunker_block': 'Bloco de Bunker de Chumbo',
            'block.realnukes.reinforced_bunker_glass': 'Vidro Blindado de Bunker',
            'item.realnukes.mini_nuke_grenade': 'Granada Mini-Nuke',
            'item.realnukes.orbital_designator': 'Designador de Ataque Orbital',
            'item.realnukes.remote_detonator': 'Detonador Remoto Nuclear',
            'item.realnukes.geiger_counter': 'Contador Geiger',
            'item.realnukes.antirad_pill': 'Pilula Anti-Radiacao Rad-X',
            'item.realnukes.hazmat_helmet': 'Capacete Hazmat',
            'item.realnukes.hazmat_chestplate': 'Peitoral Hazmat',
            'item.realnukes.hazmat_leggings': 'Calca Hazmat',
            'item.realnukes.hazmat_boots': 'Botas Hazmat',
            'msg.realnukes.hint': 'Use Isqueiro, Redstone ou Detonador Remoto para detonar!'
          }
          en = {
            'itemGroup.realnukes': 'RealNukes - Nuclear Arsenal',
            'block.realnukes.tactical_nuke': 'Tactical Mini-Nuke',
            'block.realnukes.little_boy': 'Little Boy Fission Bomb',
            'block.realnukes.fat_man': 'Fat Man Plutonium Bomb',
            'block.realnukes.hydrogen_bomb': 'Thermonuclear Hydrogen Bomb',
            'block.realnukes.tsar_bomba': 'Tsar Bomba (50 Megatons)',
            'block.realnukes.neutron_bomb': 'Neutron Radiation Bomb',
            'block.realnukes.cobalt_bomb': 'Doomsday Cobalt Bomb',
            'block.realnukes.antimatter_bomb': 'Antimatter Warhead',
            'block.realnukes.solar_bomb': 'Solar Plasma Bomb',
            'block.realnukes.trinitite_block': 'Trinitite Glass',
            'block.realnukes.radioactive_ash': 'Radioactive Ash',
            'block.realnukes.uranium_ore_block': 'Enriched Uranium Block',
            'block.realnukes.plutonium_core_block': 'Plutonium Core',
            'block.realnukes.lead_bunker_block': 'Lead Bunker Block',
            'block.realnukes.reinforced_bunker_glass': 'Reinforced Bunker Glass',
            'item.realnukes.mini_nuke_grenade': 'Mini-Nuke Grenade',
            'item.realnukes.orbital_designator': 'Orbital Strike Designator',
            'item.realnukes.remote_detonator': 'Nuclear Remote Detonator',
            'item.realnukes.geiger_counter': 'Geiger Counter',
            'item.realnukes.antirad_pill': 'Rad-X Anti-Radiation Pill',
            'item.realnukes.hazmat_helmet': 'Hazmat Helmet',
            'item.realnukes.hazmat_chestplate': 'Hazmat Chestplate',
            'item.realnukes.hazmat_leggings': 'Hazmat Leggings',
            'item.realnukes.hazmat_boots': 'Hazmat Boots',
            'msg.realnukes.hint': 'Use Flint and Steel, Redstone, or Remote Detonator to detonate!'
          }
          w('src/main/resources/assets/realnukes/lang/pt_br.json', json.dumps(pt, indent=2))
          w('src/main/resources/assets/realnukes/lang/en_us.json', json.dumps(en, indent=2))

          J = 'src/main/java/com/realnukes/'

          # --- CLASSES JAVA ---
          w(J + 'RealNukesMod.java', """
          package com.realnukes;
          import net.minecraftforge.eventbus.api.IEventBus;
          import net.minecraftforge.fml.common.Mod;
          import net.minecraftforge.fml.javafmlmod.FMLJavaModLoadingContext;
          @Mod(RealNukesMod.MODID)
          public class RealNukesMod {
            public static final String MODID = "realnukes";
