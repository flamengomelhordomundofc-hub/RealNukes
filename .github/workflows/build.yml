            public static Block blockFor(NukeType t) {
              switch (t) {
                case LITTLE_BOY: return LITTLE_BOY.get();
                case FAT_MAN: return FAT_MAN.get();
                case HYDROGEN: return HYDROGEN_BOMB.get();
                case TSAR_BOMBA: return TSAR_BOMBA.get();
                case NEUTRON: return NEUTRON_BOMB.get();
                case COBALT: return COBALT_BOMB.get();
                case ANTIMATTER: return ANTIMATTER_BOMB.get();
                case SOLAR: return SOLAR_BOMB.get();
