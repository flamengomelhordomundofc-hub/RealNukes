          package com.realnukes;
          import java.util.ArrayList;
          import java.util.HashMap;
          import java.util.Iterator;
          import java.util.List;
          import java.util.Locale;
          import java.util.Map;
          import net.minecraft.ChatFormatting;
          import net.minecraft.core.BlockPos;
          import net.minecraft.core.particles.ParticleTypes;
          import net.minecraft.network.chat.Component;
          import net.minecraft.resources.ResourceKey;
          import net.minecraft.server.level.ServerLevel;
          import net.minecraft.server.level.ServerPlayer;
          import net.minecraft.sounds.SoundEvents;
          import net.minecraft.sounds.SoundSource;
          import net.minecraft.tags.BlockTags;
          import net.minecraft.world.effect.MobEffectInstance;
          import net.minecraft.world.effect.MobEffects;
          import net.minecraft.world.entity.Entity;
          import net.minecraft.world.entity.LivingEntity;
          import net.minecraft.world.level.Level;
          import net.minecraft.world.level.block.AbstractGlassBlock;
          import net.minecraft.world.level.block.Blocks;
          import net.minecraft.world.level.block.StainedGlassPaneBlock;
          import net.minecraft.world.level.block.state.BlockState;
          import net.minecraft.world.level.levelgen.Heightmap;
          import net.minecraft.world.phys.AABB;
          import net.minecraft.world.phys.Vec3;
          import net.minecraftforge.event.TickEvent;
          import net.minecraftforge.event.level.LevelEvent;
          import net.minecraftforge.eventbus.api.SubscribeEvent;
          import net.minecraftforge.fml.common.Mod;

          @Mod.EventBusSubscriber(modid = RealNukesMod.MODID, bus = Mod.EventBusSubscriber.Bus.FORGE)
          public class NuclearExplosionManager {
            static class Blast {
              final BlockPos c;
              final RealNukesMod.NukeType t;
              final int[] cols;
              int idx = 0;
              double shock = 0;
              int age = 0;

              Blast(BlockPos c, RealNukesMod.NukeType t) {
                this.c = c;
                this.t = t;
                int ro = (int)(t.radius * 1.28);
                int[] cnt = new int[ro + 2];
                for (int dx = -ro; dx <= ro; dx++)
                  for (int dz = -ro; dz <= ro; dz++) {
                    int r = (int)Math.sqrt(dx * dx + dz * dz);
                    if (r <= ro) cnt[r]++;
                  }
                int tot = 0;
                int[] off = new int[ro + 2];
                for (int i = 0; i <= ro; i++) {
                  off[i] = tot;
                  tot += cnt[i];
                }
                cols = new int[tot];
                for (int dx = -ro; dx <= ro; dx++)
                  for (int dz = -ro; dz <= ro; dz++) {
                    int r = (int)Math.sqrt(dx * dx + dz * dz);
                    if (r <= ro) cols[off[r]++] = ((dx + 512) << 10) | (dz + 512);
                  }
              }
            }

            static class RadZone {
              final BlockPos c;
              final int r;
              int ticks;
              RadZone(BlockPos c, int r, int t) { this.c = c; this.r = r; this.ticks = t; }
            }

            private static final Map<ResourceKey<Level>, List<Blast>> BLASTS = new HashMap<>();
            private static final Map<ResourceKey<Level>, List<RadZone>> RADS = new HashMap<>();

            public static void detonate(ServerLevel lv, BlockPos c, RealNukesMod.NukeType t) {
              NukeEntities.NuclearCloudEntity cl = new NukeEntities.NuclearCloudEntity(RealNukesMod.NUCLEAR_CLOUD.get(), lv);
              cl.setPos(c.getX() + 0.5, c.getY() + 0.5, c.getZ() + 0.5);
              cl.setNukeType(t);
              lv.addFreshEntity(cl);
              BLASTS.computeIfAbsent(lv.dimension(), k -> new ArrayList<>()).add(new Blast(c, t));
              if (t.radR > 0) RADS.computeIfAbsent(lv.dimension(), k -> new ArrayList<>()).add(new RadZone(c, t.radR, t.radS * 20));
            }

            public static double getRad(ServerLevel lv, Vec3 p) {
              double tot = 0;
              List<RadZone> zs = RADS.get(lv.dimension());
              if (zs != null) {
                for (RadZone z : zs) {
                  double d = p.distanceTo(Vec3.atCenterOf(z.c));
                  if (d < z.r) tot += Math.pow(1.0 - d / z.r, 1.6) * 60.0;
                }
              }
              return tot;
            }

            @SubscribeEvent
            public static void onUnload(LevelEvent.Unload ev) {
              if (ev.getLevel() instanceof ServerLevel lv) {
                BLASTS.remove(lv.dimension());
                RADS.remove(lv.dimension());
              }
            }

            @SubscribeEvent
            public static void onTick(TickEvent.LevelTickEvent ev) {
              if (ev.phase != TickEvent.Phase.END || !(ev.level instanceof ServerLevel lv)) return;
              List<Blast> bs = BLASTS.get(lv.dimension());
              if (bs != null) {
                Iterator<Blast> it = bs.iterator();
                while (it.hasNext()) {
                  Blast b = it.next();
                  if (stepBlast(lv, b)) it.remove();
                }
              }
              List<RadZone> rs = RADS.get(lv.dimension());
              if (rs != null) {
                Iterator<RadZone> it = rs.iterator();
                while (it.hasNext()) {
                  RadZone z = it.next();
                  z.ticks--;
                  if (z.ticks <= 0) {
                    it.remove();
                    continue;
                  }
                  if (z.ticks % 16 == 0) {
                    AABB box = new AABB(z.c).inflate(z.r);
                    for (LivingEntity e : lv.getEntitiesOfClass(LivingEntity.class, box)) {
                      if (RealNukesMod.hasHazmat(e)) continue;
                      double d = e.position().distanceTo(Vec3.atCenterOf(z.c));
                      if (d < z.r) {
                        int lvEf = d < z.r * 0.45 ? 1 : 0;
                        e.addEffect(new MobEffectInstance(MobEffects.WITHER, 90, lvEf));
                        e.addEffect(new MobEffectInstance(MobEffects.CONFUSION, 110, 0));
                        e.addEffect(new MobEffectInstance(MobEffects.WEAKNESS, 90, 0));
                      }
                    }
                  }
                  if (z.ticks % 8 == 0) {
                    double a = lv.random.nextDouble() * 6.283;
                    double rd = lv.random.nextDouble() * z.r * 0.8;
                    lv.sendParticles(ParticleTypes.ASH, z.c.getX() + Math.cos(a) * rd, z.c.getY() + 18, z.c.getZ() + Math.sin(a) * rd, 2, 4, 4, 4, 0.02);
                  }
                }
              }
              if (lv.getGameTime() % 12 == 0) {
                for (ServerPlayer sp : lv.players()) {
                  if (sp.getMainHandItem().is(RealNukesMod.GEIGER_COUNTER.get()) || sp.getOffhandItem().is(RealNukesMod.GEIGER_COUNTER.get())) {
                    double rad = getRad(lv, sp.position());
                    if (rad > 0.5) {
                      ChatFormatting c = rad < 10 ? ChatFormatting.YELLOW : ChatFormatting.RED;
                      sp.displayClientMessage(Component.literal("RAD: " + String.format(Locale.ROOT, "%.1f", rad) + " RAD/s").withStyle(c, ChatFormatting.BOLD), true);
                      lv.playSound(null, sp.blockPosition(), SoundEvents.STONE_BUTTON_CLICK_ON, SoundSource.PLAYERS, 0.5f, (float)Math.min(2.0, 1.0 + rad * 0.02));
                    }
                  }
                }
              }
            }

            private static boolean stepBlast(ServerLevel lv, Blast b) {
              b.age++;
              int maxD = Math.min(30, (int)(b.t.radius * 0.40));
              BlockPos.MutableBlockPos mp = new BlockPos.MutableBlockPos();
              int end = Math.min(b.cols.length, b.idx + 260);
              for (; b.idx < end; b.idx++) {
                int pk = b.cols[b.idx];
                int dx = (pk >> 10) - 512;
                int dz = (pk & 1023) - 512;
                int wx = b.c.getX() + dx, wz = b.c.getZ() + dz;
                mp.set(wx, b.c.getY(), wz);
                if (!lv.isLoaded(mp)) continue;
                double d = Math.sqrt(dx * dx + dz * dz) / b.t.radius;
                if (d <= 1.0) {
                  int floor = Math.max(lv.getMinBuildHeight() + 2, b.c.getY() - (int)(maxD * (1.0 - d * d)));
                  int top = Math.min(lv.getMaxBuildHeight() - 1, b.c.getY() + Math.min(38, (int)(b.t.radius * 0.55)));
                  for (int y = top; y >= floor; y--) {
                    mp.set(wx, y, wz);
                    BlockState st = lv.getBlockState(mp);
                    if (st.isAir() || st.getBlock().getExplosionResistance() >= 1800f) continue;
                    lv.setBlock(mp, Blocks.AIR.defaultBlockState(), 18);
                  }
                  mp.set(wx, floor - 1, wz);
                  BlockState fst = lv.getBlockState(mp);
                  if (!fst.isAir() && fst.getBlock().getExplosionResistance() < 1800f) {
                    if (b.t.lava && d < 0.52 && lv.random.nextFloat() < 0.65f) lv.setBlock(mp, Blocks.LAVA.defaultBlockState(), 18);
                    else if (b.t.anti && d < 0.75) lv.setBlock(mp, Blocks.OBSIDIAN.defaultBlockState(), 18);
                    else if (b.t.tri && d < 0.45 && lv.random.nextFloat() < 0.7f) lv.setBlock(mp, RealNukesMod.TRINITITE_BLOCK.get().defaultBlockState(), 18);
                    else if (d < 0.78 && lv.random.nextFloat() < 0.55f) lv.setBlock(mp, RealNukesMod.RADIOACTIVE_ASH.get().defaultBlockState(), 18);
                  }
                } else {
                  int sy = lv.getHeight(Heightmap.Types.WORLD_SURFACE, wx, wz);
                  for (int y = sy; y >= Math.max(lv.getMinBuildHeight() + 2, sy - 14); y--) {
                    mp.set(wx, y, wz);
                    BlockState st = lv.getBlockState(mp);
                    if (st.isAir() || st.getBlock().getExplosionResistance() >= 1800f) continue;
                    if (st.is(BlockTags.LEAVES) || ((st.getBlock() instanceof AbstractGlassBlock || st.is(Blocks.GLASS_PANE) || st.getBlock() instanceof StainedGlassPaneBlock) && !st.is(RealNukesMod.REINFORCED_BUNKER_GLASS.get()))) {
                      lv.setBlock(mp, Blocks.AIR.defaultBlockState(), 18);
                    } else if (st.is(Blocks.GRASS_BLOCK)) {
                      lv.setBlock(mp, (lv.random.nextFloat() < 0.4f ? RealNukesMod.RADIOACTIVE_ASH.get() : Blocks.COARSE_DIRT).defaultBlockState(), 18);
                      if (lv.random.nextFloat() < 0.07f) {
                        mp.set(wx, y + 1, wz);
                        if (lv.getBlockState(mp).isAir()) lv.setBlock(mp, Blocks.FIRE.defaultBlockState(), 18);
                      }
                      break;
                    }
                  }
                }
              }
              double maxSh = b.t.radius * 2.2;
              if (b.shock < maxSh) {
                double prev = b.shock;
                b.shock += 4.5;
                AABB box = new AABB(b.c).inflate(b.shock + 2);
                for (Entity e : lv.getEntitiesOfClass(Entity.class, box)) {
                  if (e instanceof NukeEntities.NuclearCloudEntity) continue;
                  Vec3 dir = e.position().subtract(Vec3.atCenterOf(b.c));
                  double dist = dir.length();
                  if (dist >= prev - 2 && dist <= b.shock + 2) {
                    double f = Math.max(0.05, 1.0 - dist / maxSh);
                    Vec3 n = dist > 0.1 ? dir.normalize() : new Vec3(0, 1, 0);
                    double k = (b.t.anti && b.age < 5) ? -1.4 : 3.2 * f;
                    e.setDeltaMovement(e.getDeltaMovement().add(n.x * k, Math.max(0.4, n.y * k + 1.1 * f), n.z * k));
                    e.hurtMarked = true;
                    float dmg = (float)(b.t.radius * 1.4 * f);
                    if (e instanceof LivingEntity le && RealNukesMod.hasHazmat(le)) dmg *= 0.35f;
                    if (dmg > 1f) e.hurt(b.t.neu ? lv.damageSources().magic() : lv.damageSources().explosion(null, null), dmg);
                    if (dist < b.t.radius * 1.2) e.setSecondsOnFire(8);
                  }
                }
              }
              return b.idx >= b.cols.length && b.shock >= maxSh;
            }
          }
