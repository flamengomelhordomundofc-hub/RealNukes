          w(J + 'ClientCinema.java', """
          package com.realnukes;
          import java.util.ArrayList;
          import java.util.Iterator;
          import java.util.List;
          import com.mojang.blaze3d.platform.GlStateManager;
          import com.mojang.blaze3d.systems.RenderSystem;
          import com.mojang.blaze3d.vertex.BufferBuilder;
          import com.mojang.blaze3d.vertex.BufferUploader;
          import com.mojang.blaze3d.vertex.DefaultVertexFormat;
          import com.mojang.blaze3d.vertex.Tesselator;
          import com.mojang.blaze3d.vertex.VertexFormat;
          import net.minecraft.client.Minecraft;
          import net.minecraft.client.player.LocalPlayer;
          import net.minecraft.client.renderer.ShaderInstance;
          import net.minecraft.sounds.SoundEvents;
          import net.minecraft.sounds.SoundSource;
          import net.minecraft.world.effect.MobEffects;
          import net.minecraft.world.entity.Entity;
          import net.minecraft.world.phys.Vec3;
          import net.minecraftforge.api.distmarker.Dist;
          import net.minecraftforge.client.event.RenderGuiOverlayEvent;
          import net.minecraftforge.client.event.RenderLevelStageEvent;
          import net.minecraftforge.client.event.ViewportEvent;
          import net.minecraftforge.client.gui.overlay.VanillaGuiOverlay;
          import net.minecraftforge.event.TickEvent;
          import net.minecraftforge.eventbus.api.SubscribeEvent;
          import net.minecraftforge.fml.common.Mod;
          import org.joml.Matrix4f;

          @Mod.EventBusSubscriber(modid = RealNukesMod.MODID, bus = Mod.EventBusSubscriber.Bus.FORGE, value = Dist.CLIENT)
          public class ClientCinema {
            static class Pending {
              int ticks;
              float shake, vol;
              Pending(int t, float s, float v) { ticks = t; shake = s; vol = v; }
            }
            private static final List<Pending> QUEUE = new ArrayList<>();
            private static float flash = 0f, heat = 0f, shake = 0f, fR = 1f, fG = 0.96f, fB = 0.88f;
            private static int flash2Timer = 0;
            private static float flash2Pow = 0f;
            private static int tick = 0;

            @SubscribeEvent
            public static void onRenderStage(RenderLevelStageEvent ev) {
              if (ev.getStage() != RenderLevelStageEvent.Stage.AFTER_ENTITIES) return;
              ShaderInstance sh = ClientModEvents.VOLUMETRIC_SHADER;
              Minecraft mc = Minecraft.getInstance();
              if (sh == null || mc.level == null) return;

              Vec3 cam = ev.getCamera().getPosition();
              float pt = ev.getPartialTick();
              List<NukeEntities.NuclearCloudEntity> list = new ArrayList<>();
              for (Entity en : mc.level.entitiesForRendering()) {
                if (en instanceof NukeEntities.NuclearCloudEntity nc) list.add(nc);
              }
              if (list.isEmpty()) return;

              list.sort((a, b) -> Double.compare(b.distanceToSqr(cam), a.distanceToSqr(cam)));
              float sunAngle = mc.level.getTimeOfDay(pt) * 6.28318f;
              float sunBr = Math.max(0.24f, Math.min(1.15f, 0.35f + 0.80f * (float)Math.cos(sunAngle)));

              RenderSystem.enableBlend();
              RenderSystem.blendFuncSeparate(
                GlStateManager.SourceFactor.SRC_ALPHA, GlStateManager.DestFactor.ONE_MINUS_SRC_ALPHA,
                GlStateManager.SourceFactor.ONE, GlStateManager.DestFactor.ONE_MINUS_SRC_ALPHA
              );
              RenderSystem.depthMask(false);
              RenderSystem.setShader(() -> sh);

              Matrix4f viewBase = new Matrix4f(RenderSystem.getModelViewMatrix()).mul(ev.getPoseStack().last().pose());

              for (NukeEntities.NuclearCloudEntity nc : list) {
                RealNukesMod.NukeType ty = nc.getNukeType();
                float t = nc.getCloudAge() + pt;
                float prog = Math.min(1f, t / ty.dur);
                float rise = 1f - (float)Math.pow(1f - Math.min(1f, t / (ty.dur * 0.32f)), 3.2);
                float H = ty.cloudH * (0.06f + 0.94f * rise);
                float R = ty.cloudR * (0.22f + 0.78f * (float)Math.pow(Math.min(1f, t / (ty.dur * 0.38f)), 0.55)) + (prog > 0.32f ? (prog - 0.32f) * ty.cloudR * 0.72f : 0f);
                float bR = Math.max(R * 2.25f, t < 75f ? t * 5.0f + 10f : 0f);
                float bH = Math.max(H + R * 1.15f, t < 75f ? t * 5.0f + 10f : 0f);
                float cx = (float)(cam.x - nc.getX()), cy = (float)(cam.y - nc.getY()), cz = (float)(cam.z - nc.getZ());

                Matrix4f localMV = new Matrix4f(viewBase).translate(-cx, -cy, -cz);
                sh.safeGetUniform("LocalMV").set(localMV);
                sh.safeGetUniform("CamPos").set(cx, cy, cz);
                sh.safeGetUniform("BoxMin").set(-bR, -3f, -bR);
                sh.safeGetUniform("BoxMax").set(bR, bH, bR);
                sh.safeGetUniform("CloudParams").set(t, ty.cloudH, ty.cloudR, (float)ty.dur);
                sh.safeGetUniform("FireCol").set(ty.fr, ty.fg, ty.fb);
                sh.safeGetUniform("SmokeCol").set(ty.sr, ty.sg, ty.sb);
                sh.safeGetUniform("ExtraParams").set((float)ty.rings, ty.exotic ? 1f : 0f, sunBr, (float)(nc.getId() % 97) * 1.73f);

                boolean inside = (cx >= -bR && cx <= bR && cy >= -3f && cy <= bH && cz >= -bR && cz <= bR);
                if (inside) {
                  RenderSystem.disableDepthTest();
                } else {
                  RenderSystem.enableDepthTest();
                }
                RenderSystem.enableCull();

                BufferBuilder bb = Tesselator.getInstance().getBuilder();
                bb.begin(VertexFormat.Mode.QUADS, DefaultVertexFormat.POSITION);
                emitBox(bb, -bR, -3f, -bR, bR, bH, bR, inside);
                BufferUploader.drawWithShader(bb.end());
              }

              RenderSystem.depthMask(true);
              RenderSystem.enableDepthTest();
              RenderSystem.enableCull();
              RenderSystem.defaultBlendFunc();
              RenderSystem.disableBlend();
            }

            private static void quad(BufferBuilder bb, float x0, float y0, float z0, float x1, float y1, float z1, float x2, float y2, float z2, float x3, float y3, float z3, boolean rev) {
              if (!rev) {
                bb.vertex(x0, y0, z0).endVertex();
                bb.vertex(x1, y1, z1).endVertex();
                bb.vertex(x2, y2, z2).endVertex();
                bb.vertex(x3, y3, z3).endVertex();
              } else {
                bb.vertex(x0, y0, z0).endVertex();
                bb.vertex(x3, y3, z3).endVertex();
                bb.vertex(x2, y2, z2).endVertex();
                bb.vertex(x1, y1, z1).endVertex();
              }
            }

            private static void emitBox(BufferBuilder bb, float x0, float y0, float z0, float x1, float y1, float z1, boolean rev) {
              quad(bb, x0, y0, z1, x1, y0, z1, x1, y1, z1, x0, y1, z1, rev);
              quad(bb, x1, y0, z0, x0, y0, z0, x0, y1, z0, x1, y1, z0, rev);
              quad(bb, x1, y0, z1, x1, y0, z0, x1, y1, z0, x1, y1, z1, rev);
              quad(bb, x0, y0, z0, x0, y0, z1, x0, y1, z1, x0, y1, z0, rev);
              quad(bb, x0, y1, z1, x1, y1, z1, x1, y1, z0, x0, y1, z0, rev);
              quad(bb, x0, y0, z0, x1, y0, z0, x1, y0, z1, x0, y0, z1, rev);
            }

            @SubscribeEvent
            public static void onClientTick(TickEvent.ClientTickEvent ev) {
              if (ev.phase != TickEvent.Phase.END) return;
              Minecraft mc = Minecraft.getInstance();
              LocalPlayer p = mc.player;
              if (p == null || mc.level == null) return;
              tick++;

              synchronized (ClientCinemaState.INCOMING) {
                for (ClientCinemaState.Event e : ClientCinemaState.INCOMING) {
                  double d = p.position().distanceTo(new Vec3(e.x, e.y, e.z));
                  float fac = (float)Math.max(0.0, 1.35 - d / 420.0);
                  float pow = Math.min(1f, e.type.flash * fac);
                  flash = Math.min(1f, Math.max(flash, pow));
                  flash2Pow = Math.max(flash2Pow, pow * 0.92f);
                  flash2Timer = 8;
                  heat = Math.min(0.32f, Math.max(heat, 0.30f * fac));
                  fR = 0.75f + 0.25f * e.type.fr;
                  fG = 0.72f + 0.28f * e.type.fg;
                  fB = 0.68f + 0.32f * e.type.fb;
                  int delay = Math.max(1, (int)(d / 2.2));
                  QUEUE.add(new Pending(delay, e.type.shake * Math.min(1f, fac), Math.min(1f, fac)));
                }
                ClientCinemaState.INCOMING.clear();
              }

              if (flash2Timer > 0) {
                flash2Timer--;
                if (flash2Timer == 0) {
                  flash = Math.min(1f, Math.max(flash, flash2Pow));
                  flash2Pow = 0f;
                }
              }

              Iterator<Pending> it = QUEUE.iterator();
              while (it.hasNext()) {
                Pending q = it.next();
                q.ticks--;
                if (q.ticks <= 0) {
                  shake = Math.min(18f, shake + q.shake);
                  mc.level.playLocalSound(p.getX(), p.getY(), p.getZ(), SoundEvents.GENERIC_EXPLODE, SoundSource.AMBIENT, 3.2f * q.vol, 0.34f, false);
                  mc.level.playLocalSound(p.getX(), p.getY(), p.getZ(), SoundEvents.WARDEN_SONIC_BOOM, SoundSource.AMBIENT, 2.6f * q.vol, 0.44f, false);
                  mc.level.playLocalSound(p.getX(), p.getY(), p.getZ(), SoundEvents.LIGHTNING_BOLT_THUNDER, SoundSource.AMBIENT, 3.0f * q.vol, 0.48f, false);
                  it.remove();
                }
              }

              flash *= 0.90f; if (flash < 0.005f) flash = 0f;
              heat *= 0.975f; if (heat < 0.005f) heat = 0f;
              shake *= 0.89f; if (shake < 0.02f) shake = 0f;
            }

            @SubscribeEvent
            public static void onCam(ViewportEvent.ComputeCameraAngles ev) {
              if (shake <= 0.02f) return;
              double t = tick + ev.getPartialTick();
              ev.setYaw(ev.getYaw() + (float)(Math.sin(t * 2.7) * shake * 0.55));
              ev.setPitch(ev.getPitch() + (float)(Math.cos(t * 3.3) * shake * 0.45));
              ev.setRoll(ev.getRoll() + (float)(Math.sin(t * 4.1) * shake * 0.65));
            }

            @SubscribeEvent
            public static void onOverlay(RenderGuiOverlayEvent.Post ev) {
              if (ev.getOverlay() != VanillaGuiOverlay.HOTBAR.type()) return;
              int w = ev.getWindow().getGuiScaledWidth(), h = ev.getWindow().getGuiScaledHeight();
              if (heat > 0.01f) {
                int a = (int)(heat * 255);
                ev.getGuiGraphics().fill(0, 0, w, h, (a << 24) | 0xFFB866);
              }
              if (flash > 0.01f) {
                int a = (int)(Math.min(1f, flash) * 255);
                int c = (a << 24) | ((int)(fR * 255) << 16) | ((int)(fG * 255) << 8) | (int)(fB * 255);
                ev.getGuiGraphics().fill(0, 0, w, h, c);
              }
              LocalPlayer p = Minecraft.getInstance().player;
              if (p != null && p.hasEffect(MobEffects.WITHER) && p.hasEffect(MobEffects.CONFUSION)) {
                int a = (int)(45 + 25 * Math.sin(tick * 0.25));
                int col = (a << 24) | 0x44FF55;
                ev.getGuiGraphics().fill(0, 0, w, 10, col);
                ev.getGuiGraphics().fill(0, h - 10, w, h, col);
                ev.getGuiGraphics().fill(0, 0, 10, h, col);
                ev.getGuiGraphics().fill(w - 10, 0, w, h, col);
              }
            }
          }
