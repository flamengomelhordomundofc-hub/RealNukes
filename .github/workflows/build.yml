                float u0 = (float)i / segs, u1 = (float)(i + 1) / segs;
                vc.vertex(m, c0 * r0, y0, s0 * r0).color(r, g, b, a).uv(u0, 0f).overlayCoords(OverlayTexture.NO_OVERLAY).uv2(light).normal(n, c0, 0f, s0).endVertex();
                vc.vertex(m, c1 * r0, y0, s1 * r0).color(r, g, b, a).uv(u1, 0f).overlayCoords(OverlayTexture.NO_OVERLAY).uv2(light).normal(n, c1, 0f, s1).endVertex();
                vc.vertex(m, c1 * r1, y1, s1 * r1).color(r, g, b, a).uv(u1, 1f).overlayCoords(OverlayTexture.NO_OVERLAY).uv2(light).normal(n, c1, 0f, s1).endVertex();
                vc.vertex(m, c0 * r1, y1, s0 * r1).color(r, g, b, a).uv(u0, 1f).overlayCoords(OverlayTexture.NO_OVERLAY).uv2(light).normal(n, c0, 0f, s0).endVertex();
              }
            }
            @Override
            public ResourceLocation getTextureLocation(FallingMissileEntity e) {
              return MISSILE_TEX;
            }
          }
