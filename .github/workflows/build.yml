          import net.minecraft.client.renderer.texture.OverlayTexture;
          import net.minecraft.resources.ResourceLocation;
          import net.minecraft.util.Mth;
          import org.joml.Matrix3f;
          import org.joml.Matrix4f;

          public class MushroomCloudRenderer extends EntityRenderer<MushroomCloudEntity> {
            private static final ResourceLocation CLOUD_TEX = new ResourceLocation(RealNukesMod.MODID, "textures/entity/volumetric_cloud.png");
            private static final ResourceLocation FIRE_TEX = new ResourceLocation(RealNukesMod.MODID, "textures/entity/fireball_core.png");
            private static final ResourceLocation RING_TEX = new ResourceLocation(RealNukesMod.MODID, "textures/entity/shockwave_ring.png");

            public MushroomCloudRenderer(EntityRendererProvider.Context ctx) {
              super(ctx);
            }

            @Override
            public boolean shouldRender(MushroomCloudEntity entity, Frustum frustum, double camX, double camY, double camZ) {
              return entity.distanceToSqr(camX, camY, camZ) < 1024.0 * 1024.0;
            }

            @Override
            public void render(MushroomCloudEntity e, float yaw, float pt, PoseStack ps, MultiBufferSource buf, int light) {
              NukeType t = e.getNukeType();
              float age = e.getCloudAge() + pt;
              float life = Mth.clamp(age / (float)t.duration, 0f, 1f);
              if (life >= 1f) return;

              float fadeOut = life > 0.72f ? 1f - ((life - 0.72f) / 0.28f) : 1f;
              fadeOut = Mth.clamp(fadeOut, 0f, 1f);
              float rise = 1f - (float)Math.pow(1f - Mth.clamp(age / (t.duration * 0.30f), 0f, 1f), 2.4);
              float cool = Mth.clamp(age / (t.duration * 0.45f), 0f, 1f);
              float scroll = age * 0.015f;

              float curH = t.cloudH * (0.18f + 0.82f * rise);
              float capR = t.cloudR * (0.28f + 0.72f * rise) * (1f + 0.14f * life);
              float stemR = capR * 0.24f;

              VertexConsumer fireVc = buf.getBuffer(RenderType.entityTranslucent(FIRE_TEX));
              VertexConsumer cloudVc = buf.getBuffer(RenderType.entityTranslucent(CLOUD_TEX));
              VertexConsumer ringVc = buf.getBuffer(RenderType.entityTranslucent(RING_TEX));

              // 1. Bola de fogo incandescente inicial + nucleo termico ascendente
              float fireAlpha = Mth.clamp((1f - age / (t.duration * 0.28f)) * 0.95f, 0f, 0.95f);
              if (fireAlpha > 0.02f) {
                float fbR = t.cloudR * (0.18f + 0.56f * Mth.clamp(age / 38f, 0f, 1f));
                float fbY = curH * 0.22f + fbR * 0.55f;
                ps.pushPose();
                ps.translate(0f, fbY, 0f);
                ps.mulPose(Axis.YP.rotationDegrees(age * 1.4f));
                drawSphere(ps, fireVc, fbR * 0.62f, fbR * 0.58f, fbR * 0.62f, 16, 10, 1f, 0.97f, 0.9f, fireAlpha, LightTexture.FULL_BRIGHT, scroll);
                drawSphere(ps, fireVc, fbR, fbR * 0.92f, fbR, 18, 10, t.fr, t.fg, t.fb, fireAlpha * 0.85f, LightTexture.FULL_BRIGHT, -scroll * 0.7f);
                ps.popPose();
              }

              // 2. Domo de choque Mach + onda de choque no solo
              float shockT = age / 75f;
              if (shockT < 1.25f) {
                float shockAlpha = Mth.clamp((1f - shockT / 1.25f) * 0.62f, 0f, 0.62f);
                float domeR = 4f + age * 3.8f;
                ps.pushPose();
                drawDome(ps, ringVc, domeR, domeR * 0.68f, 22, 9, 0.92f, 0.96f, 1.0f, shockAlpha * 0.55f, LightTexture.FULL_BRIGHT, scroll);
                drawTorus(ps, ringVc, domeR, Math.max(1.2f, domeR * 0.055f), Math.max(0.8f, domeR * 0.03f), 24, 6, 0.95f, 0.97f, 1.0f, shockAlpha * 0.85f, LightTexture.FULL_BRIGHT, scroll);
                ps.popPose();
              }

              // 3. Base de poeira (Base Surge)
              float dustR = t.cloudR * (0.45f + 1.05f * Mth.clamp(age / (t.duration * 0.55f), 0f, 1f));
              float dustH = Math.max(3.5f, t.cloudR * 0.16f * (0.5f + 0.5f * rise));
              ps.pushPose();
              ps.translate(0f, dustH * 0.45f, 0f);
              ps.mulPose(Axis.YP.rotationDegrees(-age * 0.65f));
              drawTorus(ps, cloudVc, dustR * 0.68f, dustR * 0.34f, dustH, 20, 8, t.sr * 0.82f, t.sg * 0.80f, t.sb * 0.78f, 0.72f * fadeOut, light, scroll * 0.5f);
              ps.popPose();

              // 4. Coluna ascendente giratoria (nucleo quente + fumaca externa)
              ps.pushPose();
              ps.mulPose(Axis.YP.rotationDegrees(age * 0.95f));
              float cr = Mth.lerp(cool, t.fr, t.sr);
              float cg = Mth.lerp(cool, t.fg, t.sg);
              float cb = Mth.lerp(cool, t.fb, t.sb);
              drawColumn(ps, cloudVc, stemR * 1.45f, stemR * 0.72f, curH * 0.84f, 16, 10, cr * 0.88f, cg * 0.85f, cb * 0.82f, 0.82f * fadeOut, light, 1.1f, scroll);
              if (cool < 0.82f) {
                float coreA = (1f - cool / 0.82f) * 0.75f * fadeOut;
                drawColumn(ps, fireVc, stemR * 0.75f, stemR * 0.42f, curH * 0.82f, 12, 8, t.fr, t.fg, t.fb, coreA, LightTexture.FULL_BRIGHT, -1.4f, scroll * 1.5f);
              }
              ps.popPose();

              // 5. Aneis de condensacao de Wilson
              if (age > 14f && age < t.duration * 0.68f) {
                float wFade = Mth.clamp((age - 14f) / 18f, 0f, 1f) * Mth.clamp(1f - (age / (t.duration * 0.68f)), 0f, 1f);
                for (int i = 0; i < t.wilsonRings; i++) {
                  float frac = 0.42f + i * 0.17f;
                  float wy = curH * frac;
                  float wr = capR * (0.62f + i * 0.24f) * (0.75f + 0.35f * rise);
                  ps.pushPose();
                  ps.translate(0f, wy, 0f);
                  ps.mulPose(Axis.YP.rotationDegrees(age * (0.5f + i * 0.25f)));
                  drawTorus(ps, ringVc, wr, wr * 0.085f, wr * 0.042f, 22, 6, 0.94f, 0.97f, 1.0f, 0.56f * wFade, LightTexture.FULL_BRIGHT, scroll * 0.4f);
                  ps.popPose();
                }
              }

              // 6. Topo toroidal em 3D em camadas (coroa + toroide + brilho inferior)
              ps.pushPose();
              ps.translate(0f, curH * 0.86f, 0f);
              ps.mulPose(Axis.YP.rotationDegrees(age * 0.55f));
              float capTubeR = capR * 0.44f;
              float capTubeY = capR * 0.36f;

              // Camada externa volumetrica toroidal
              drawTorus(ps, cloudVc, capR * 0.58f, capTubeR, capTubeY, 22, 10, Mth.lerp(cool * 0.85f, t.fr, t.sr), Mth.lerp(cool * 0.85f, t.fg, t.sg), Mth.lerp(cool * 0.85f, t.fb, t.sb), 0.88f * fadeOut, light, scroll * 0.8f);

              // Domo superior do cogumelo
              ps.pushPose();
              ps.translate(0f, capTubeY * 0.35f, 0f);
              drawSphere(ps, cloudVc, capR * 0.88f, capR * 0.42f, capR * 0.88f, 18, 8, t.sr, t.sg, t.sb, 0.84f * fadeOut, light, -scroll * 0.5f);
              ps.popPose();

              // Brilho incandescente interno na base do cogumelo
              if (cool < 0.88f) {
                float glowA = (1f - cool / 0.88f) * 0.82f * fadeOut;
                ps.pushPose();
                ps.translate(0f, -capTubeY * 0.18f, 0f);
                drawTorus(ps, fireVc, capR * 0.48f, capTubeR * 0.65f, capTubeY * 0.52f, 18, 8, t.fr, t.fg, t.fb, glowA, LightTexture.FULL_BRIGHT, scroll * 1.4f);
                ps.popPose();
              }
              ps.popPose();
            }

            private static void drawSphere(PoseStack ps, VertexConsumer vc, float rx, float ry, float rz, int segs, int stacks, float r, float g, float b, float a, int light, float uvOff) {
              PoseStack.Pose pose = ps.last();
              Matrix4f m = pose.pose();
              Matrix3f n = pose.normal();
              r = Mth.clamp(r, 0f, 1f); g = Mth.clamp(g, 0f, 1f); b = Mth.clamp(b, 0f, 1f); a = Mth.clamp(a, 0f, 1f);
              for (int j = 0; j < stacks; j++) {
                float p0 = (float)(-Math.PI * 0.5 + Math.PI * j / stacks);
                float p1 = (float)(-Math.PI * 0.5 + Math.PI * (j + 1) / stacks);
                float cp0 = (float)Math.cos(p0), sp0 = (float)Math.sin(p0);
                float cp1 = (float)Math.cos(p1), sp1 = (float)Math.sin(p1);
                float v0 = (float)j / stacks + uvOff, v1 = (float)(j + 1) / stacks + uvOff;
                for (int i = 0; i < segs; i++) {
                  float t0 = (float)(2.0 * Math.PI * i / segs);
                  float t1 = (float)(2.0 * Math.PI * (i + 1) / segs);
                  float ct0 = (float)Math.cos(t0), st0 = (float)Math.sin(t0);
                  float ct1 = (float)Math.cos(t1), st1 = (float)Math.sin(t1);
                  float u0 = (float)i / segs, u1 = (float)(i + 1) / segs;
                  vc.vertex(m, ct0 * cp0 * rx, sp0 * ry, st0 * cp0 * rz).color(r, g, b, a).uv(u0, v0).overlayCoords(OverlayTexture.NO_OVERLAY).uv2(light).normal(n, ct0 * cp0, sp0, st0 * cp0).endVertex();
                  vc.vertex(m, ct1 * cp0 * rx, sp0 * ry, st1 * cp0 * rz).color(r, g, b, a).uv(u1, v0).overlayCoords(OverlayTexture.NO_OVERLAY).uv2(light).normal(n, ct1 * cp0, sp0, st1 * cp0).endVertex();
                  vc.vertex(m, ct1 * cp1 * rx, sp1 * ry, st1 * cp1 * rz).color(r, g, b, a).uv(u1, v1).overlayCoords(OverlayTexture.NO_OVERLAY).uv2(light).normal(n, ct1 * cp1, sp1, st1 * cp1).endVertex();
                  vc.vertex(m, ct0 * cp1 * rx, sp1 * ry, st0 * cp1 * rz).color(r, g, b, a).uv(u0, v1).overlayCoords(OverlayTexture.NO_OVERLAY).uv2(light).normal(n, ct0 * cp1, sp1, st0 * cp1).endVertex();
                }
              }
            }

            private static void drawDome(PoseStack ps, VertexConsumer vc, float rx, float ry, int segs, int stacks, float r, float g, float b, float a, int light, float uvOff) {
              PoseStack.Pose pose = ps.last();
              Matrix4f m = pose.pose();
              Matrix3f n = pose.normal();
              r = Mth.clamp(r, 0f, 1f); g = Mth.clamp(g, 0f, 1f); b = Mth.clamp(b, 0f, 1f); a = Mth.clamp(a, 0f, 1f);
              for (int j = 0; j < stacks; j++) {
                float p0 = (float)(Math.PI * 0.5 * j / stacks);
                float p1 = (float)(Math.PI * 0.5 * (j + 1) / stacks);
                float cp0 = (float)Math.cos(p0), sp0 = (float)Math.sin(p0);
                float cp1 = (float)Math.cos(p1), sp1 = (float)Math.sin(p1);
                float v0 = (float)j / stacks + uvOff, v1 = (float)(j + 1) / stacks + uvOff;
                for (int i = 0; i < segs; i++) {
                  float t0 = (float)(2.0 * Math.PI * i / segs);
                  float t1 = (float)(2.0 * Math.PI * (i + 1) / segs);
                  float ct0 = (float)Math.cos(t0), st0 = (float)Math.sin(t0);
                  float ct1 = (float)Math.cos(t1), st1 = (float)Math.sin(t1);
                  float u0 = (float)i / segs, u1 = (float)(i + 1) / segs;
                  vc.vertex(m, ct0 * cp0 * rx, sp0 * ry, st0 * cp0 * rx).color(r, g, b, a).uv(u0, v0).overlayCoords(OverlayTexture.NO_OVERLAY).uv2(light).normal(n, ct0 * cp0, sp0, st0 * cp0).endVertex();
                  vc.vertex(m, ct1 * cp0 * rx, sp0 * ry, st1 * cp0 * rx).color(r, g, b, a).uv(u1, v0).overlayCoords(OverlayTexture.NO_OVERLAY).uv2(light).normal(n, ct1 * cp0, sp0, st1 * cp0).endVertex();
                  vc.vertex(m, ct1 * cp1 * rx, sp1 * ry, st1 * cp1 * rx).color(r, g, b, a).uv(u1, v1).overlayCoords(OverlayTexture.NO_OVERLAY).uv2(light).normal(n, ct1 * cp1, sp1, st1 * cp1).endVertex();
                  vc.vertex(m, ct0 * cp1 * rx, sp1 * ry, st0 * cp1 * rx).color(r, g, b, a).uv(u0, v1).overlayCoords(OverlayTexture.NO_OVERLAY).uv2(light).normal(n, ct0 * cp1, sp1, st0 * cp1).endVertex();
                }
              }
            }

            private static void drawTorus(PoseStack ps, VertexConsumer vc, float majorR, float minorR, float minorY, int segs, int tubeSegs, float r, float g, float b, float a, int light, float uvOff) {
              PoseStack.Pose pose = ps.last();
              Matrix4f m = pose.pose();
              Matrix3f n = pose.normal();
              r = Mth.clamp(r, 0f, 1f); g = Mth.clamp(g, 0f, 1f); b = Mth.clamp(b, 0f, 1f); a = Mth.clamp(a, 0f, 1f);
              for (int i = 0; i < segs; i++) {
                float u0 = (float)(2.0 * Math.PI * i / segs);
                float u1 = (float)(2.0 * Math.PI * (i + 1) / segs);
                float cu0 = (float)Math.cos(u0), su0 = (float)Math.sin(u0);
                float cu1 = (float)Math.cos(u1), su1 = (float)Math.sin(u1);
                float tu0 = (float)i / segs, tu1 = (float)(i + 1) / segs;
                for (int j = 0; j < tubeSegs; j++) {
                  float v0 = (float)(2.0 * Math.PI * j / tubeSegs);
                  float v1 = (float)(2.0 * Math.PI * (j + 1) / tubeSegs);
                  float cv0 = (float)Math.cos(v0), sv0 = (float)Math.sin(v0);
                  float cv1 = (float)Math.cos(v1), sv1 = (float)Math.sin(v1);
                  float tv0 = (float)j / tubeSegs + uvOff, tv1 = (float)(j + 1) / tubeSegs + uvOff;
                  float rr0 = majorR + minorR * cv0;
                  float rr1 = majorR + minorR * cv1;
                  vc.vertex(m, rr0 * cu0, sv0 * minorY, rr0 * su0).color(r, g, b, a).uv(tu0, tv0).overlayCoords(OverlayTexture.NO_OVERLAY).uv2(light).normal(n, cv0 * cu0, sv0, cv0 * su0).endVertex();
                  vc.vertex(m, rr0 * cu1, sv0 * minorY, rr0 * su1).color(r, g, b, a).uv(tu1, tv0).overlayCoords(OverlayTexture.NO_OVERLAY).uv2(light).normal(n, cv0 * cu1, sv0, cv0 * su1).endVertex();
                  vc.vertex(m, rr1 * cu1, sv1 * minorY, rr1 * su1).color(r, g, b, a).uv(tu1, tv1).overlayCoords(OverlayTexture.NO_OVERLAY).uv2(light).normal(n, cv1 * cu1, sv1, cv1 * su1).endVertex();
                  vc.vertex(m, rr1 * cu0, sv1 * minorY, rr1 * su0).color(r, g, b, a).uv(tu0, tv1).overlayCoords(OverlayTexture.NO_OVERLAY).uv2(light).normal(n, cv1 * cu0, sv1, cv1 * su0).endVertex();
                }
              }
            }

            private static void drawColumn(PoseStack ps, VertexConsumer vc, float botR, float topR, float h, int segs, int stacks, float r, float g, float b, float a, int light, float twist, float uvOff) {
              PoseStack.Pose pose = ps.last();
              Matrix4f m = pose.pose();
              Matrix3f n = pose.normal();
              r = Mth.clamp(r, 0f, 1f); g = Mth.clamp(g, 0f, 1f); b = Mth.clamp(b, 0f, 1f); a = Mth.clamp(a, 0f, 1f);
              for (int j = 0; j < stacks; j++) {
                float f0 = (float)j / stacks;
                float f1 = (float)(j + 1) / stacks;
                float y0 = f0 * h, y1 = f1 * h;
                float r0 = Mth.lerp(f0, botR, topR) * (1f + 0.12f * (float)Math.sin(f0 * Math.PI * 3.0));
                float r1 = Mth.lerp(f1, botR, topR) * (1f + 0.12f * (float)Math.sin(f1 * Math.PI * 3.0));
                float tw0 = f0 * twist, tw1 = f1 * twist;
                float v0 = f0 * 2f - uvOff, v1 = f1 * 2f - uvOff;
                for (int i = 0; i < segs; i++) {
                  float a00 = (float)(2.0 * Math.PI * i / segs) + tw0;
                  float a10 = (float)(2.0 * Math.PI * (i + 1) / segs) + tw0;
                  float a01 = (float)(2.0 * Math.PI * i / segs) + tw1;
                  float a11 = (float)(2.0 * Math.PI * (i + 1) / segs) + tw1;
                  float u0 = (float)i / segs, u1 = (float)(i + 1) / segs;
                  vc.vertex(m, (float)Math.cos(a00) * r0, y0, (float)Math.sin(a00) * r0).color(r, g, b, a).uv(u0, v0).overlayCoords(OverlayTexture.NO_OVERLAY).uv2(light).normal(n, (float)Math.cos(a00), 0f, (float)Math.sin(a00)).endVertex();
                  vc.vertex(m, (float)Math.cos(a10) * r0, y0, (float)Math.sin(a10) * r0).color(r, g, b, a).uv(u1, v0).overlayCoords(OverlayTexture.NO_OVERLAY).uv2(light).normal(n, (float)Math.cos(a10), 0f, (float)Math.sin(a10)).endVertex();
                  vc.vertex(m, (float)Math.cos(a11) * r1, y1, (float)Math.sin(a11) * r1).color(r, g, b, a).uv(u1, v1).overlayCoords(OverlayTexture.NO_OVERLAY).uv2(light).normal(n, (float)Math.cos(a11), 0f, (float)Math.sin(a11)).endVertex();
                  vc.vertex(m, (float)Math.cos(a01) * r1, y1, (float)Math.sin(a01) * r1).color(r, g, b, a).uv(u0, v1).overlayCoords(OverlayTexture.NO_OVERLAY).uv2(light).normal(n, (float)Math.cos(a01), 0f, (float)Math.sin(a01)).endVertex();
                }
              }
            }

            @Override
            public ResourceLocation getTextureLocation(MushroomCloudEntity e) {
              return CLOUD_TEX;
            }
          }
          """)

