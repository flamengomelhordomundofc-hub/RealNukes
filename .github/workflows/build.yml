            public static boolean hasHazmat(LivingEntity e) {
              return e.getItemBySlot(EquipmentSlot.HEAD).is(HAZMAT_HELMET.get())
                && e.getItemBySlot(EquipmentSlot.CHEST).is(HAZMAT_CHESTPLATE.get())
                && e.getItemBySlot(EquipmentSlot.LEGS).is(HAZMAT_LEGGINGS.get())
                && e.getItemBySlot(EquipmentSlot.FEET).is(HAZMAT_BOOTS.get());
            }

            public static class HazmatMat implements ArmorMaterial {
