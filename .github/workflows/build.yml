            public static class OrbitalDesignatorItem extends Item {
              public OrbitalDesignatorItem(Properties p) { super(p); }
              @Override
              public InteractionResultHolder<ItemStack> use(Level lv, Player p, InteractionHand h) {
                ItemStack st = p.getItemInHand(h);
                Vec3 start = p.getEyePosition();
                Vec3 end = start.add(p.getLookAngle().scale(160.0));
                BlockHitResult hit = lv.clip(new ClipContext(start, end, ClipContext.Block.OUTLINE, ClipContext.Fluid.ANY, p));
                if (hit.getType() == HitResult.Type.MISS) {
                  if (!lv.isClientSide) p.displayClientMessage(Component.literal("Mire em um bloco a ate 160 blocos!").withStyle(ChatFormatting.RED), true);
                  return InteractionResultHolder.fail(st);
                }
                p.getCooldowns().addCooldown(this, 60);
                if (!lv.isClientSide) {
                  Vec3 loc = hit.getLocation();
                  NukeEntities.FallingMissileEntity m = new NukeEntities.FallingMissileEntity(FALLING_MISSILE.get(), lv);
                  m.setPos(loc.x, Math.min(lv.getMaxBuildHeight() + 60.0, loc.y + 135.0), loc.z);
                  lv.addFreshEntity(m);
                  lv.playSound(null, p.blockPosition(), SoundEvents.BEACON_ACTIVATE, SoundSource.PLAYERS, 1.5f, 1.4f);
                  p.displayClientMessage(Component.literal("ATAQUE ORBITAL CONFIRMADO! Missil termonuclear a caminho!").withStyle(ChatFormatting.RED, ChatFormatting.BOLD), true);
                }
                return InteractionResultHolder.sidedSuccess(st, lv.isClientSide);
              }
            }

            public static class RemoteDetonatorItem extends Item {
              public RemoteDetonatorItem(Properties p) { super(p); }
              @Override
              public InteractionResult useOn(UseOnContext ctx) {
                Level lv = ctx.getLevel();
                BlockPos pos = ctx.getClickedPos();
                if (lv.getBlockState(pos).getBlock() instanceof NuclearBombBlock) {
                  if (!lv.isClientSide) {
                    CompoundTag tag = ctx.getItemInHand().getOrCreateTag();
                    tag.putInt("tx", pos.getX()); tag.putInt("ty", pos.getY()); tag.putInt("tz", pos.getZ());
                    lv.playSound(null, pos, SoundEvents.EXPERIENCE_ORB_PICKUP, SoundSource.PLAYERS, 1.0f, 1.3f);
                    if (ctx.getPlayer() != null) ctx.getPlayer().displayClientMessage(Component.literal("Bomba vinculada em " + pos.getX() + ", " + pos.getY() + ", " + pos.getZ() + "! Afaste-se e clique direito no ar!").withStyle(ChatFormatting.GREEN), true);
                  }
                  return InteractionResult.sidedSuccess(lv.isClientSide);
                }
                return InteractionResult.PASS;
              }
              @Override
              public InteractionResultHolder<ItemStack> use(Level lv, Player p, InteractionHand h) {
                ItemStack st = p.getItemInHand(h);
                CompoundTag tag = st.getTag();
                if (tag == null || !tag.contains("tx")) {
                  if (!lv.isClientSide) p.displayClientMessage(Component.literal("Clique direito em uma bomba primeiro para vincular!").withStyle(ChatFormatting.YELLOW), true);
                  return InteractionResultHolder.fail(st);
                }
                if (!lv.isClientSide) {
                  BlockPos pos = new BlockPos(tag.getInt("tx"), tag.getInt("ty"), tag.getInt("tz"));
                  BlockState bs = lv.getBlockState(pos);
                  if (bs.getBlock() instanceof NuclearBombBlock bomb) {
                    bomb.prime(lv, pos, 10);
                    lv.playSound(null, p.blockPosition(), SoundEvents.LEVER_CLICK, SoundSource.PLAYERS, 1.2f, 0.7f);
                    p.displayClientMessage(Component.literal("DETONACAO REMOTA ACIONADA!").withStyle(ChatFormatting.RED, ChatFormatting.BOLD), true);
                  } else {
                    p.displayClientMessage(Component.literal("Nenhuma bomba encontrada na coordenada salva!").withStyle(ChatFormatting.RED), true);
                  }
                }
                return InteractionResultHolder.sidedSuccess(st, lv.isClientSide);
              }
            }

            public static class GeigerCounterItem extends Item {
              public GeigerCounterItem(Properties p) { super(p); }
              @Override
              public InteractionResultHolder<ItemStack> use(Level lv, Player p, InteractionHand h) {
                ItemStack st = p.getItemInHand(h);
                if (lv instanceof ServerLevel sl) {
                  double rad = NuclearExplosionManager.getRad(sl, p.position());
                  ChatFormatting col = rad < 2.0 ? ChatFormatting.GREEN : (rad < 15.0 ? ChatFormatting.YELLOW : ChatFormatting.RED);
                  String txt = "GEIGER: " + String.format(Locale.ROOT, "%.1f", rad) + " RAD/s " + (rad < 2.0 ? "[SEGURO]" : (rad < 15.0 ? "[PERIGO]" : "[EXTREMO - USE HAZMAT]"));
                  p.displayClientMessage(Component.literal(txt).withStyle(col, ChatFormatting.BOLD), true);
                  lv.playSound(null, p.blockPosition(), SoundEvents.STONE_BUTTON_CLICK_ON, SoundSource.PLAYERS, 0.7f, (float)Math.min(2.0, 0.9 + rad * 0.03));
                }
                return InteractionResultHolder.sidedSuccess(st, lv.isClientSide);
              }
            }

            public static class AntiRadPillItem extends Item {
              public AntiRadPillItem(Properties p) {
                super(p.food(new FoodProperties.Builder().nutrition(1).saturationMod(0.2f).alwaysEat().fast().build()));
              }
              @Override
              public ItemStack finishUsingItem(ItemStack st, Level lv, LivingEntity e) {
                if (!lv.isClientSide) {
                  e.removeEffect(MobEffects.WITHER);
                  e.removeEffect(MobEffects.POISON);
                  e.removeEffect(MobEffects.CONFUSION);
                  e.removeEffect(MobEffects.WEAKNESS);
                  e.addEffect(new MobEffectInstance(MobEffects.REGENERATION, 200, 1));
                  e.addEffect(new MobEffectInstance(MobEffects.DAMAGE_RESISTANCE, 1800, 1));
                  if (e instanceof Player p) p.displayClientMessage(Component.literal("Rad-X tomado! Radiacao purificada!").withStyle(ChatFormatting.AQUA), true);
                }
                return super.finishUsingItem(st, lv, e);
              }
            }
