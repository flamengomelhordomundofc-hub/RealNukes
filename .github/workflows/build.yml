          # --- ClientCinemaState.java ---
          w(J + 'ClientCinemaState.java', """
          package com.realnukes;
          import java.util.ArrayList;
          import java.util.List;
          public class ClientCinemaState {
            public static class Event {
              public final double x, y, z;
              public final RealNukesMod.NukeType type;
              public Event(double x, double y, double z, RealNukesMod.NukeType type) {
                this.x = x; this.y = y; this.z = z; this.type = type;
              }
            }
            public static final List<Event> INCOMING = new ArrayList<>();
            public static void push(double x, double y, double z, RealNukesMod.NukeType type) {
              synchronized (INCOMING) {
                INCOMING.add(new Event(x, y, z, type));
              }
            }
          }
